<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionnaire de Projet — MathoDuo</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
/* ═══════════════════════════════════════════════════
   GESTIONNAIRE DE PROJET — styles v2
   Aligné sur les tokens de l'application principale
═══════════════════════════════════════════════════ */

@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap');

/* ── Variables (reprises des tokens de l'app) ── */
:root {
  --g-primary:       #4F46E5;
  --g-primary-light: #818CF8;
  --g-primary-dark:  #3730A3;
  --g-primary-faint: #EEF2FF;
  --g-success:       #10B981;
  --g-danger:        #EF4444;
  --g-warning:       #F59E0B;
  --g-xp:            #FBBF24;
  --g-pink:          #EC4899;

  --g-bg:        #0D0B1F;
  --g-surface:   #13112A;
  --g-surface-2: #1A1735;
  --g-surface-3: #211E3D;
  --g-border:    rgba(99,102,241,0.18);
  --g-border-2:  rgba(99,102,241,0.32);
  --g-text:      #E2E8F0;
  --g-text-2:    #94A3B8;
  --g-muted:     #64748B;

  --g-r-sm: 8px;
  --g-r-md: 12px;
  --g-r-lg: 16px;
  --g-r-xl: 22px;
  --g-r-full: 9999px;

  --g-t: 150ms ease;
}

/* ── Bannière dossier de travail ── */
.g-folder-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  height: 36px;
  background: linear-gradient(90deg, rgba(79,70,229,.18), rgba(129,140,248,.10));
  border-bottom: 1px solid rgba(99,102,241,.35);
  font-size: 11px;
  flex-shrink: 0;
  animation: fadeIn .3s ease;
}
.g-folder-banner__icon { font-size: 15px; }
.g-folder-banner__path {
  font-family: 'JetBrains Mono', monospace;
  color: #A5B4FC;
  font-weight: 600;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.g-folder-banner__status {
  font-size: 10px;
  color: var(--g-success);
  font-weight: 700;
}
.g-folder-banner__status.saving { color: var(--g-warning); }
.g-folder-banner__status.error  { color: var(--g-danger); }
.g-folder-banner__btn {
  background: rgba(99,102,241,.2);
  border: 1px solid rgba(99,102,241,.4);
  color: #A5B4FC;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: var(--g-r-sm);
  cursor: pointer;
  transition: all var(--g-t);
  white-space: nowrap;
}
.g-folder-banner__btn:hover { background: rgba(99,102,241,.35); }
@keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body {
  font-family: 'Outfit', system-ui, sans-serif;
  background: var(--g-bg);
  color: var(--g-text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,0.5); }

/* ══════════════════════════════════════════════════
   LAYOUT PRINCIPAL
══════════════════════════════════════════════════ */
.g-app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.g-topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 24px;
  height: 52px;
  background: var(--g-surface);
  border-bottom: 1px solid var(--g-border);
  flex-shrink: 0;
  z-index: 10;
}
.g-topbar__logo {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--g-primary-light), var(--g-primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  flex-shrink: 0;
}
.g-topbar__title {
  font-size: 13px;
  font-weight: 800;
  color: #A5B4FC;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.g-topbar__stats {
  font-size: 11px;
  color: var(--g-muted);
  display: flex;
  gap: 12px;
}
.g-topbar__stat { display: flex; align-items: center; gap: 4px; }
.g-topbar__stat-dot {
  width: 6px; height: 6px; border-radius: 50%;
}
.g-topbar__actions { margin-left: auto; display: flex; gap: 8px; }

.g-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ══════════════════════════════════════════════════
   SIDEBAR ARBRE
══════════════════════════════════════════════════ */
.g-sidebar {
  background: var(--g-surface);
  border-right: 1px solid var(--g-border);
  overflow: hidden auto;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}

/* Niveau scolaire */
.g-tree-level {
  border-bottom: 1px solid var(--g-border);
}
.g-tree-level-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px 6px;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--g-primary-light);
}
.g-tree-level-header button {
  background: none;
  border: none;
  color: var(--g-primary-light);
  cursor: pointer;
  font-size: 14px;
  opacity: 0.6;
  transition: opacity var(--g-t);
  padding: 2px 6px;
  border-radius: var(--g-r-sm);
}
.g-tree-level-header button:hover { opacity: 1; background: rgba(99,102,241,.15); }

/* Matière */
.g-tree-subject-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  font-size: 12px;
  font-weight: 700;
  color: var(--g-text-2);
}
.g-tree-subject-header .g-add-btn {
  margin-left: auto;
  background: none;
  border: none;
  color: var(--g-primary);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  opacity: 0.55;
  padding: 2px 5px;
  border-radius: var(--g-r-sm);
  transition: all var(--g-t);
}
.g-tree-subject-header .g-add-btn:hover { opacity: 1; background: rgba(99,102,241,.15); }

/* Chapitre */
.g-tree-chapter {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px 7px 18px;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all var(--g-t);
  user-select: none;
}
.g-tree-chapter:hover { background: rgba(99,102,241,.08); }
.g-tree-chapter.active {
  background: rgba(99,102,241,.14);
  border-left-color: var(--g-primary);
}
.g-tree-chapter__icon { font-size: 14px; flex-shrink: 0; }
.g-tree-chapter__label {
  font-size: 12px;
  font-weight: 600;
  color: #CBD5E1;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.g-tree-chapter.active .g-tree-chapter__label { color: var(--g-text); }
.g-tree-chapter__count {
  font-size: 10px;
  color: var(--g-muted);
  flex-shrink: 0;
}
.g-tree-chapter__add {
  background: none;
  border: none;
  color: var(--g-primary);
  cursor: pointer;
  font-size: 15px;
  line-height: 1;
  opacity: 0;
  padding: 2px 4px;
  border-radius: 4px;
  transition: all var(--g-t);
  flex-shrink: 0;
}
.g-tree-chapter:hover .g-tree-chapter__add { opacity: 0.6; }
.g-tree-chapter__add:hover { opacity: 1 !important; background: rgba(99,102,241,.2); }

/* Notion */
.g-tree-notion {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 14px 5px 34px;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all var(--g-t);
  user-select: none;
}
.g-tree-notion:hover { background: rgba(99,102,241,.06); }
.g-tree-notion.active {
  background: rgba(139,92,246,.1);
  border-left-color: #8B5CF6;
}
.g-tree-notion__dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.g-tree-notion__label {
  font-size: 11px;
  color: var(--g-text-2);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: color var(--g-t);
}
.g-tree-notion.active .g-tree-notion__label { color: var(--g-text); font-weight: 600; }
.g-tree-notion__info {
  font-size: 9px;
  color: var(--g-muted);
  flex-shrink: 0;
}

/* Badges NEW */
.g-badge-new {
  font-size: 8px;
  font-weight: 800;
  color: var(--g-success);
  background: rgba(16,185,129,.12);
  border: 1px solid rgba(16,185,129,.3);
  border-radius: 3px;
  padding: 1px 5px;
  flex-shrink: 0;
}
.g-badge-l1 {
  font-size: 8px;
  font-weight: 800;
  color: var(--g-pink);
  background: rgba(236,72,153,.12);
  border: 1px solid rgba(236,72,153,.3);
  border-radius: 3px;
  padding: 1px 5px;
  flex-shrink: 0;
}

/* ── Splitter ── */
.g-splitter {
  width: 4px;
  background: var(--g-border);
  cursor: col-resize;
  flex-shrink: 0;
  transition: background var(--g-t);
}
.g-splitter:hover, .g-splitter.dragging { background: var(--g-primary); }

/* ══════════════════════════════════════════════════
   PANNEAU PRINCIPAL
══════════════════════════════════════════════════ */
.g-main {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--g-bg);
}

/* ── Vue chapitre ── */
.g-chapter-view {
  padding: 28px 32px;
  overflow: hidden auto;
  height: 100%;
}
.g-chapter-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.g-chapter-icon {
  width: 52px;
  height: 52px;
  border-radius: var(--g-r-lg);
  background: linear-gradient(135deg, rgba(99,102,241,.35), rgba(139,92,246,.25));
  border: 1px solid var(--g-border-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}
.g-chapter-title { font-size: 20px; font-weight: 800; color: var(--g-text); }
.g-chapter-desc  { font-size: 12px; color: var(--g-muted); margin-top: 3px; }
.g-chapter-meta  { display: flex; gap: 14px; margin-top: 6px; }
.g-chapter-meta span { font-size: 11px; font-weight: 600; }

.g-progress-bar {
  height: 5px;
  background: rgba(99,102,241,.1);
  border-radius: var(--g-r-full);
  overflow: hidden;
  margin-bottom: 24px;
}
.g-progress-fill {
  height: 100%;
  border-radius: var(--g-r-full);
  background: linear-gradient(90deg, var(--g-primary), var(--g-primary-light));
  transition: width 600ms ease;
}

/* Grille notions */
.g-notions-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 12px;
}

/* Carte notion */
.g-notion-card {
  background: var(--g-surface);
  border: 1.5px solid var(--g-border);
  border-radius: var(--g-r-lg);
  padding: 16px 18px;
  cursor: pointer;
  transition: all var(--g-t);
  position: relative;
}
.g-notion-card:hover {
  border-color: var(--g-border-2);
  background: var(--g-surface-2);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(99,102,241,.12);
}
.g-notion-card.l1 { border-color: rgba(236,72,153,.2); }
.g-notion-card.l1:hover { border-color: rgba(236,72,153,.45); }
.g-notion-card__header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 8px;
}
.g-notion-card__num {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(99,102,241,.5), rgba(139,92,246,.4));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 900;
  color: #A5B4FC;
  flex-shrink: 0;
}
.g-notion-card.l1 .g-notion-card__num {
  background: linear-gradient(135deg, rgba(236,72,153,.5), rgba(190,24,93,.4));
  color: #F9A8D4;
}
.g-notion-card__name {
  font-size: 13px;
  font-weight: 700;
  color: var(--g-text);
  line-height: 1.35;
  flex: 1;
}
.g-notion-card__status {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 4px;
}
.g-notion-card__text {
  font-size: 11px;
  color: var(--g-muted);
  line-height: 1.55;
  margin-bottom: 10px;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.g-notion-card__blocks {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: center;
}
.g-notion-card__block-chip {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 20px;
  font-weight: 600;
}
.g-notion-card__qcount {
  font-size: 10px;
  color: var(--g-muted);
  margin-left: auto;
}

/* ── Éditeur notion ── */
.g-editor {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--g-bg);
}
.g-editor-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: var(--g-surface);
  border-bottom: 1px solid var(--g-border);
  flex-shrink: 0;
  gap: 12px;
}
.g-editor-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--g-text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.g-editor-meta {
  font-size: 10px;
  color: var(--g-primary-light);
  margin-top: 2px;
  font-family: 'JetBrains Mono', monospace;
}
.g-editor-tabs {
  display: flex;
  border-bottom: 1px solid var(--g-border);
  background: var(--g-surface);
  flex-shrink: 0;
}
.g-editor-tab {
  padding: 10px 18px;
  border: none;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--g-muted);
  font-family: 'Outfit', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--g-t);
  white-space: nowrap;
}
.g-editor-tab:hover { color: var(--g-text-2); }
.g-editor-tab.active {
  color: var(--g-primary-light);
  border-bottom-color: var(--g-primary);
  background: rgba(99,102,241,.06);
}
.g-editor-body {
  flex: 1;
  overflow: hidden auto;
  padding: 20px 22px;
}

/* ── Blocs ── */
.g-block-adder {
  background: var(--g-surface);
  border: 1px dashed var(--g-border-2);
  border-radius: var(--g-r-md);
  padding: 14px 16px;
  margin-bottom: 16px;
}
.g-block-adder-title {
  font-size: 10px;
  font-weight: 800;
  color: var(--g-primary-light);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.g-block-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.g-block-chip-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid;
  background: transparent;
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--g-t);
}
.g-block-chip-btn:hover { opacity: 0.8; filter: brightness(1.1); }

.g-block {
  background: var(--g-surface);
  border: 1px solid var(--g-border);
  border-radius: var(--g-r-md);
  overflow: hidden;
  margin-bottom: 10px;
  transition: border-color var(--g-t);
}
.g-block:hover { border-color: var(--g-border-2); }
.g-block-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  background: var(--g-surface-2);
  border-bottom: 1px solid var(--g-border);
  cursor: default;
}
.g-block-type-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.g-block-type-label {
  font-size: 11px;
  font-weight: 700;
  flex: 1;
}
.g-block-actions {
  display: flex;
  gap: 2px;
}
.g-block-action-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--g-muted);
  padding: 3px 6px;
  border-radius: 4px;
  font-size: 12px;
  transition: all var(--g-t);
}
.g-block-action-btn:hover { background: rgba(99,102,241,.15); color: var(--g-text); }
.g-block-action-btn.del:hover { background: rgba(239,68,68,.15); color: var(--g-danger); }
.g-block-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }

/* ── Champs ── */
.g-field-group { display: flex; flex-direction: column; gap: 5px; }
.g-field-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--g-primary-light);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.g-field {
  width: 100%;
  background: var(--g-surface-2);
  border: 1px solid var(--g-border);
  border-radius: var(--g-r-sm);
  color: var(--g-text);
  padding: 8px 11px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  outline: none;
  resize: vertical;
  transition: border-color var(--g-t);
}
.g-field:focus { border-color: var(--g-primary); background: var(--g-surface-3); }
.g-field::placeholder { color: var(--g-muted); opacity: 0.7; }
select.g-field { resize: none; cursor: pointer; }

.g-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── Boutons ── */
.g-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 18px;
  border: none;
  border-radius: var(--g-r-md);
  font-family: 'Outfit', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--g-t);
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.g-btn:disabled { opacity: .38; cursor: not-allowed; }
.g-btn-primary {
  background: var(--g-primary);
  color: #fff;
  border-bottom: 3px solid var(--g-primary-dark);
}
.g-btn-primary:not(:disabled):hover { filter: brightness(1.08); }
.g-btn-primary:not(:disabled):active { transform: translateY(2px); border-bottom-width: 1px; }
.g-btn-ghost {
  background: var(--g-surface-2);
  color: var(--g-text-2);
  border: 1px solid var(--g-border);
}
.g-btn-ghost:not(:disabled):hover { background: var(--g-surface-3); color: var(--g-text); border-color: var(--g-border-2); }
.g-btn-danger {
  background: rgba(239,68,68,.12);
  color: #F87171;
  border: 1px solid rgba(239,68,68,.28);
}
.g-btn-danger:not(:disabled):hover { background: rgba(239,68,68,.22); }
.g-btn-success {
  background: rgba(16,185,129,.12);
  color: #34D399;
  border: 1px solid rgba(16,185,129,.28);
}
.g-btn-success:not(:disabled):hover { background: rgba(16,185,129,.22); }
.g-btn-sm { padding: 5px 12px; font-size: 11px; border-radius: var(--g-r-sm); }

/* ══════════════════════════════════════════════════
   MODALS
══════════════════════════════════════════════════ */
.g-modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(6px);
  animation: gFadeIn 150ms ease;
}
@keyframes gFadeIn { from { opacity: 0; } to { opacity: 1; } }

.g-modal {
  background: var(--g-surface);
  border: 1px solid var(--g-border-2);
  border-radius: var(--g-r-xl);
  padding: 28px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;

</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">

    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ── Utils ──────────────────────────────────────────
    const slugify = s => (s||"").toLowerCase().normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
    const genId = () => "id_"+Math.random().toString(36).slice(2,8);

    // ── Block types ────────────────────────────────────
    const BLOCK_TYPES = [
      {type:"definition", label:"Définition",  icon:"📌", color:"#6366f1"},
      {type:"formula",    label:"Formule",      icon:"🔑", color:"#FBBF24"},
      {type:"example",    label:"Exemple",      icon:"✅", color:"#10B981"},
      {type:"warning",    label:"Attention",    icon:"⚠️", color:"#EF4444"},
      {type:"technique",  label:"Technique",    icon:"🛠️", color:"#38BDF8"},
      {type:"demo",       label:"Démo",         icon:"🔬", color:"#A78BFA"},
      {type:"graph",      label:"Graphe SVG",   icon:"📈", color:"#FB923C"},
      {type:"image",      label:"Image",        icon:"🖼️", color:"#EC4899"},
    ];
    const BT = Object.fromEntries(BLOCK_TYPES.map(b=>[b.type,b]));

    // ── Convert SUBJECTS → structure interne ──────────
    function subjectsToProject(subjects) {
      const structure = {};
      Object.values(subjects).forEach(subject => {
        Object.entries(subject.levels||{}).forEach(([levelId, level]) => {
          if (!structure[levelId]) {
            structure[levelId] = { id:levelId, label:level.label, color:level.color||"#4F46E5", subjects:{} };
          }
          structure[levelId].subjects[subject.id] = {
            id: subject.id, label: subject.label, icon: subject.emoji||"📚",
            chapters: (level.chapitres||[]).map(ch => ({
              id: ch.id,
              label: ch.title||ch.label||ch.id,
              icon: ch.icon||"📚",
              description: ch.description||"",
              xpMax: ch.xpMax,
              notions: (ch.notions||[]).map(n => ({
                id: n.id, label: n.label, icon: n.icon,
                lesson: n.lesson||{formula:"",text:"",example:""},
                fullBlocks: (n.fullBlocks||[]).map((b,i)=>({...b,_id:b._id||genId()+i})),
                levels: n.levels||Array(6).fill([]),
                _readonly: true,
              })),
              l1Notions: ch.l1Bonus ? (ch.l1Bonus.notions||[]).map(n => ({
                id: n.id+"_l1", label: n.label+" (L1)", icon: n.icon,
                lesson: n.lesson||{formula:"",text:"",example:""},
                fullBlocks: (n.fullBlocks||[]).map((b,i)=>({...b,_id:b._id||genId()+i})),
                levels: n.levels||Array(6).fill([]),
                _readonly: true, _isL1: true,
              })) : [],
            }))
          };
        });
      });
      return structure;
    }

    // ── Serialiser JS ──────────────────────────────────
    function ser(v, d=0) {
      const i = "  ".repeat(d);
      if (v===null||v===undefined) return "null";
      if (typeof v==="string")  return JSON.stringify(v);
      if (typeof v==="number"||typeof v==="boolean") return String(v);
      if (Array.isArray(v)) {
        if (v.length===0) return "[]";
        return `[\n${v.map(x=>i+"  "+ser(x,d+1)).join(",\n")}\n${i}]`;
      }
      const skip = ["_id","_readonly","_isL1","_new"];
      const entries = Object.entries(v)
        .filter(([k])=>!skip.includes(k))
        .map(([k,val])=>`${i}  ${k}: ${ser(val,d+1)}`).join(",\n");
      return `{\n${entries}\n${i}}`;
    }
    function exportChapterJS(ch, sid, lid) {
      // Toutes les notions (standard + L1) sont concentrées dans index.js
      const mapNotion = n => {
        const fb = (n.fullBlocks||[]).map(b=>{const{_id,...r}=b;return r;});
        return {id:n.id, label:n.label, icon:n.icon,
                lesson:n.lesson||{}, fullBlocks:fb,
                levels:n.levels||Array(6).fill([])};
      };
      const obj = {
        id:ch.id, title:ch.label, description:ch.description||"",
        icon:ch.icon||"📚", xpMax:ch.xpMax||200,
        notions: (ch.notions||[]).map(mapNotion),
        l1Bonus: (ch.l1Notions||[]).length > 0 ? {
          notions: (ch.l1Notions||[]).map(mapNotion)
        } : undefined,
      };
      // Supprimer l1Bonus si vide
      if (!obj.l1Bonus) delete obj.l1Bonus;
      return `// Chapitre: ${ch.label}\n// ${lid} > ${sid}\n// Généré le ${new Date().toLocaleDateString("fr-FR")}\n// ${(ch.notions||[]).length} notion(s)${(ch.l1Notions||[]).length ? " + "+(ch.l1Notions||[]).length+" L1" : ""}\n\nexport default ${ser(obj,0)};\n`;
    }
    function exportNotionJS(n, chId) {
      const fb=(n.fullBlocks||[]).map(b=>{const{_id,...r}=b;return r;});
      const obj={id:n.id,label:n.label,icon:n.icon,chapterId:chId,lesson:n.lesson||{},fullBlocks:fb,levels:n.levels||Array(6).fill([])};
      return `// Notion: ${n.label}\n// ${new Date().toLocaleDateString("fr-FR")}\n\nexport default ${ser(obj,0)};\n`;
    }
    function dl(content, filename) {
      const url = URL.createObjectURL(new Blob([content],{type:"text/plain;charset=utf-8"}));
      const a = Object.assign(document.createElement("a"),{ href:url, download:filename });
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
    }


    // ══════════════════════════════════════════════════
    // EXPORT ARBORESCENCE LOCALE (File System Access API)
    // ══════════════════════════════════════════════════
    async function exportFullStructure(merged, onProgress, onDone, onError) {
      const slugify = s => s.toLowerCase()
        .normalize("NFD").replace(/[̀-ͯ]/g,"")
        .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

      // Compter les fichiers
      let total = 0;
      for (const lid of Object.keys(merged)) {
        const lvl = merged[lid];
        for (const sid of Object.keys(lvl.subjects||{})) {
          const subj = lvl.subjects[sid];
          for (const ch of (subj.chapters||[])) {
            total += 1 + (ch.notions||[]).length + (ch.l1Notions||[]).length;
          }
        }
      }
      if (total === 0) { onError("Aucune donnée à exporter."); return; }

      // ── Méthode 1 : File System Access API (https / localhost) ──────────────
      const canFSA = !!window.showDirectoryPicker;
      if (canFSA) {
        let rootDir;
        try {
          rootDir = await window.showDirectoryPicker({ mode: "readwrite", startIn: "documents" });
        } catch(e) {
          if (e.name === "AbortError") return;
          // Fallback vers ZIP si FSA échoue
        }
        if (rootDir) {
          const writeFile = async (dirHandle, filename, fileContent) => {
            const fh = await dirHandle.getFileHandle(filename, { create: true });
            const w  = await fh.createWritable();
            await w.write(fileContent);
            await w.close();
          };
          let done = 0;
          try {
            for (const lid of Object.keys(merged)) {
              const lvl = merged[lid];
              const levelSlug = slugify(lvl.label||lid);
              const levelDir = await rootDir.getDirectoryHandle(levelSlug, { create: true });
              for (const sid of Object.keys(lvl.subjects||{})) {
                const subj = lvl.subjects[sid];
                const subjSlug = slugify(subj.label||sid);
                const subjDir = await levelDir.getDirectoryHandle(subjSlug, { create: true });
                for (const ch of (subj.chapters||[])) {
                  const chSlug = slugify(ch.label||ch.id);
                  const chDir = await subjDir.getDirectoryHandle(chSlug, { create: true });
                  await writeFile(chDir, "index.js", exportChapterJS(ch, sid, lid));
                  done++;
                  onProgress(done, total, levelSlug+"/"+subjSlug+"/"+chSlug+"/index.js");
                  for (const notion of [...(ch.notions||[]), ...(ch.l1Notions||[])]) {
                    const notionSlug = slugify(notion.label||notion.id);
                    await writeFile(chDir, notionSlug+".js", exportNotionJS(notion, ch.id));
                    done++;
                    onProgress(done, total, levelSlug+"/"+subjSlug+"/"+chSlug+"/"+notionSlug+".js");
                  }
                }
              }
            }
            onDone(done);

    /**
     * Parse robuste : 5 stratégies en cascade.
     * Retourne {parsed, strategy} pour le debug.
     */
    function safeJsonParse(raw) {
      const log = [];

      // ── Stratégie 0 : JSON direct ──
      try {
        const r = JSON.parse(raw);
        iaLogPush({type:"parse",strategy:"direct",ok:true});
        return r;
      } catch(e) { log.push("direct: "+e.message.slice(0,80)); }

      // ── Stratégie 1 : nettoyages basiques ──
      let s1 = raw
        .replace(/\\'/g, "\u2019")               // \' invalide en JSON → apostrophe typographique
        .replace(/,\s*([\]}])/g, "$1")           // trailing commas
        .replace(/[\x00-\x09\x0B\x0C\x0E-\x1F]/g," "); // ctrl chars
      try {
        const r = JSON.parse(s1);
        iaLogPush({type:"parse",strategy:"cleanup",ok:true});
        return r;
      } catch(e) { log.push("cleanup: "+e.message.slice(0,80)); }

      // ── Stratégie 2 : extraction SVG + remplacement placeholder ──
      // Les SVG avec guillemets doubles cassent le JSON — on les extrait d'abord
      const svgMap = {};
      let svgIdx = 0;
      const svgEndPattern = new RegExp('"svgContent"\\s*:\\s*"([\\s\\S]*?)(?="(?:\\s*,|\\s*' + '}' + '))"', 'g');
      let s2 = s1.replace(svgEndPattern, (match, svgRaw) => {
        const key = `__SVG_${svgIdx++}__`;
        svgMap[key] = svgRaw;
        return `"svgContent":"${key}"`;
      });
      try {
        const r = JSON.parse(s2);
        // Réinjecter les SVG
        const restoreSvg = (obj) => {
          if (typeof obj === "string") {
            return Object.keys(svgMap).reduce((s,k) => s===k ? svgMap[k] : s, obj);
          }
          if (Array.isArray(obj)) return obj.map(restoreSvg);
          if (obj && typeof obj === "object") {
            return Object.fromEntries(Object.entries(obj).map(([k,v])=>[k,restoreSvg(v)]));
          }
          return obj;
        };
        const restored = restoreSvg(r);
        iaLogPush({type:"parse",strategy:"svg-extract",ok:true,svgCount:svgIdx});
        return restored;
      } catch(e) { log.push("svg-extract: "+e.message.slice(0,80)); }

      // ── Stratégie 3 : extraction bloc-par-bloc ──
      // Cherche "blocks":[...] et parse chaque {} individuellement
      const blocksMatch = s1.match(/"blocks"\s*:\s*\[/);
      if (blocksMatch) {
        const startIdx = s1.indexOf(blocksMatch[0]) + blocksMatch[0].length;
        const blocs = [];
        let depth=0, start=-1, inStr=false, escape=false;
        for (let i=startIdx; i<s1.length; i++) {
          const c=s1[i];
          if (escape) { escape=false; continue; }
          if (c==="\\") { escape=true; continue; }
          if (c==='"' && depth>0) { inStr=!inStr; continue; }
          if (inStr) continue;
          if (c==='{') { if(depth===0) start=i; depth++; }
          else if (c==='}') {
            depth--;
            if (depth===0 && start!==-1) {
              const chunk = s1.slice(start,i+1);
              try { blocs.push(JSON.parse(chunk)); } catch(ce) {
                // Tenter de sauver ce bloc en supprimant svgContent cassé
                try {
                  const noSvg = chunk.replace(/"svgContent"\s*:\s*"[^"]*(?:"[^"]*)*?"/g, '"svgContent":""');
                  blocs.push(JSON.parse(noSvg));
                } catch {}
              }
              start=-1;
            }
          }
        }
        if (blocs.length > 0) {
          const lessonFormula = (s1.match(/"lessonFormula"\s*:\s*"((?:[^"\\]|\\.)*)"/)||[])[1]||"";
          const lessonText    = (s1.match(/"lessonText"\s*:\s*"((?:[^"\\]|\\.)*)"/)||[])[1]||"";
          const lessonExample = (s1.match(/"lessonExample"\s*:\s*"((?:[^"\\]|\\.)*)"/)||[])[1]||"";
          iaLogPush({type:"parse",strategy:"block-by-block",ok:true,blocsFound:blocs.length});
          return { lessonFormula, lessonText, lessonExample, blocks: blocs };
        }
        log.push("block-by-block: 0 blocs récupérés");
      }

      // ── Stratégie 4 : supprimer tous les svgContent ──
      let s4 = s1.replace(/"svgContent"\s*:\s*"(?:[^"\\]|\\.)*"/g, '"svgContent":""');
      s4 = s4.replace(/,\s*([\]}])/g,"$1");
      try {
        const r = JSON.parse(s4);
        iaLogPush({type:"parse",strategy:"strip-svg",ok:true});
        return r;
      } catch(e) { log.push("strip-svg: "+e.message.slice(0,80)); }

      // ── Stratégie 5 : pour les exercices — chercher "levels":[...] ──
      const levelsMatch = s1.match(/"levels"\s*:\s*\[/);
      if (levelsMatch) {
        try {
          // Extraire tout ce qui suit "levels":[ jusqu'à la fin
          const li = s1.indexOf('"levels"');
          const sub = '{"levels":' + s1.slice(li + '"levels":'.length);
          const r = JSON.parse(sub.replace(/,\s*([\]}])/g,"$1"));
          iaLogPush({type:"parse",strategy:"levels-extract",ok:true});
          return r;
        } catch(e) { log.push("levels-extract: "+e.message.slice(0,80)); }
      }

      iaLogPush({type:"parse",strategy:"ALL_FAILED",ok:false,errors:log,rawSample:raw.slice(0,300)});
      throw new Error("❌ Parsing JSON échoué ("+log.length+" tentatives). Voir le panneau Debug IA pour la réponse brute.");
    }

          return {
            type:isInput?"input":"mcq",question,
            ...(isInput?{correct}:{answers:Array.isArray(q.answers)?q.answers.slice(0,4):["?","?","?","?"],correct:0}),
            explanation:q.explanation||"",
            ...(isProblem?{isProblem:true}:{}),
          };
        });
      });
      while(levels.length<6) levels.push([]);
      return levels;
    }

    function useCtxMenu() {
      const [menu, setMenu] = useState(null);
      const open = useCallback((e, items) => {
        e.preventDefault(); e.stopPropagation();
        const x = Math.min(e.clientX, window.innerWidth-200);
        const y = Math.min(e.clientY, window.innerHeight-items.filter(i=>i!=="sep").length*36-20);
        setMenu({x,y,items});
      },[]);
      const close = useCallback(()=>setMenu(null),[]);
      useEffect(()=>{
        const h = ()=>close();
        window.addEventListener("click",h);
        window.addEventListener("keydown",e=>{if(e.key==="Escape")close();});
        return ()=>window.removeEventListener("click",h);
      },[close]);
      return {menu,open,close};
    }

    function CtxMenu({menu,close}) {
      if(!menu) return null;
      return (
        <div className="g-ctx" style={{left:menu.x,top:menu.y}} onClick={e=>e.stopPropagation()}>
          {menu.items.map((item,i)=>
            item==="sep" ? <div key={i} className="g-ctx-sep"/> :
            <div key={i} className={`g-ctx-item ${item.danger?"danger":""}`}
              onClick={()=>{item.action();close();}}>
              <span className="g-ctx-item__icon">{item.icon}</span>
              <span>{item.label}</span>
            </div>
          )}
        </div>
      );
    }

    function NotionEditor({notion, chapterId, chapterLabel, onSave, onClose, initCfg}) {
      const [n, setN] = useState(() => ({
        ...notion,
        lesson: notion.lesson || {formula:"",text:"",example:""},
        fullBlocks: (notion.fullBlocks||[]).map((b,i)=>({...b,_id:b._id||(genId()+i)})),
        levels: notion.levels || Array(6).fill([]),
      }));
      const [saved, setSaved]   = useState(false);
      const [tab,   setTab]     = useState("lesson");

      // ── IA state ─────────────────────────────────────
      const [cfg,       setCfg]       = useState(()=>initCfg||iaCfgDefault());
      const [iaLoading, setIaLoading] = useState(false);
      const [iaStep,    setIaStep]    = useState("");
      const [iaPct,     setIaPct]     = useState(0);
      const [iaErr,     setIaErr]     = useState("");
      const [showCfg,   setShowCfg]   = useState(false);
      const [showDebug, setShowDebug] = useState(false);
      const [debugLog,  setDebugLog]  = useState([]);
      const didAutoGen = useRef(false);

      const refreshDebug = () => setDebugLog([...IA_LOG]);

      // Génère cours via IA
      const genCours = async () => {
        if(!cfg.apiKey?.trim()){setIaErr("Clé API manquante");setShowCfg(true);return;}
        setIaLoading(true);setIaPct(5);setIaStep("🧠 Construction du prompt cours…");setIaErr("");
        const prompt = iaCoursPrompt(n.label, chapterLabel||chapterId, cfg.catId||"general");
        setIaStep("📡 Envoi à l'IA ("+cfg.provider+")…"); setIaPct(15);
        try {
          const raw = await iaCall(cfg, prompt, 6000, (step, pct) => {
            setIaStep(step); setIaPct(pct);
          });
          setIaStep("🔍 Analyse de la réponse JSON…"); setIaPct(85);
          refreshDebug();
          const res = iaParseCours(raw);
          refreshDebug();
          setN(p=>({...p,
            lesson:{formula:res.lessonFormula,text:res.lessonText,example:res.lessonExample},
            fullBlocks:res.blocks,
          }));
          setIaStep("✅ "+res.blocks.length+" blocs générés !"); setIaPct(100); setTab("blocks");
        } catch(e){
          setIaErr(e.message);
          refreshDebug();
        }
        finally{setIaLoading(false);setTimeout(()=>setIaPct(0),1200);}
      };

      // Génère exercices via IA
      const genExos = async () => {
        if(!cfg.apiKey?.trim()){setIaErr("Clé API manquante");setShowCfg(true);return;}
        setIaLoading(true);setIaPct(5);setIaStep("🧠 Construction du prompt exercices…");setIaErr("");
        const prompt = iaExosPrompt(n.label, chapterLabel||chapterId, cfg.catId||"general",
          n.lesson.formula, n.lesson.text, n.lesson.example);
        setIaStep("📡 Envoi à l'IA ("+cfg.provider+")…"); setIaPct(15);
        try {
          const raw = await iaCall(cfg, prompt, 6000, (step, pct) => {
            setIaStep(step); setIaPct(pct);
          });
          setIaStep("🔍 Analyse des exercices…"); setIaPct(85);
          refreshDebug();
          const levels = iaParseExos(raw);
          refreshDebug();
          const total = levels.reduce((s,l)=>s+(Array.isArray(l)?l.length:0),0);
          setN(p=>({...p,levels}));
          setIaStep("✅ "+total+" questions générées !"); setIaPct(100); setTab("levels");
        } catch(e){
          setIaErr(e.message);
          refreshDebug();
        }
        finally{setIaLoading(false);setTimeout(()=>setIaPct(0),1200);}
      };

      // Auto-générer si demandé au montage (après création via modal IA)
      useEffect(()=>{
        if(initCfg?._autoGen && !didAutoGen.current){
          didAutoGen.current=true;
          const run=async()=>{
            if(initCfg.genCours) await genCours();
            if(initCfg.genExos)  await genExos();
          };
          run();
        }
      // eslint-disable-next-line react-hooks/exhaustive-deps
      },[]);

      const setLesson = (field, val) => setN(p=>({...p,lesson:{...p.lesson,[field]:val}}));
      const updBlocks = blocks => setN(p=>({...p,fullBlocks:blocks}));

      const addBlock = type => {
        const bt = BT[type];
        const nb = {_id:genId(),type,title:`${bt.icon} ${bt.label}`,text:"",formula:""};
        setN(p=>({...p,fullBlocks:[...p.fullBlocks,nb]}));
      };

      const handleSave = () => { onSave(n); setSaved(true); setTimeout(()=>setSaved(false),2000); };
      const handleDl   = () => dl(exportNotionJS(n,chapterId), `${n.id}.js`);

      const totalQ = n.levels.reduce((s,l)=>s+(Array.isArray(l)?l.length:0),0);
      const hasBlocks = n.fullBlocks.length > 0;
      const hasExos   = n.levels.some(l=>Array.isArray(l)&&l.length>0);
      const prov = IA_PROVIDERS.find(p=>p.id===cfg.provider)||IA_PROVIDERS[0];

      return (
        <div className="g-editor">
          {/* Topbar éditeur */}
          <div className="g-editor-topbar">
            <div style={{flex:1,minWidth:0}}>

            <button onClick={()=>setShowCfg(v=>!v)}

            </button>
            <button onClick={()=>{setShowDebug(v=>!v);refreshDebug();}}

            </button>

          {showCfg && (

                <div style={{display:"flex",gap:6,alignItems:"center"}}>

                    style={{fontSize:11,padding:"4px 8px",width:"auto"}}

                    <option value="college_maths">Collège Maths</option>
                    <option value="lycee_physique">Lycée Physique</option>
                    <option value="lycee_svt">Lycée SVT</option>
                    <option value="lycee_histoire">Lycée Histoire</option>
                    <option value="lycee_philo">Lycée Philo</option>
                    <option value="general">Général</option>
                  </select>

                </div>
              </div>
              <IAConfig cfg={cfg} onChange={c=>{setCfg(c);iaCfgSave(c);}}/>

          )}

          {/* Panneau Debug IA */}
          {showDebug && (
            <div style={{background:"#050510",border:"none",borderBottom:"1px solid rgba(99,102,241,.25)",
              flexShrink:0,maxHeight:320,overflowY:"auto",padding:"10px 16px",display:"flex",flexDirection:"column",gap:6}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
                <span style={{fontSize:10,fontWeight:900,color:"var(--g-primary-light)",letterSpacing:".12em",textTransform:"uppercase"}}>
                  🔍 Journal IA — {debugLog.length} entrée(s)
                </span>
                <div style={{display:"flex",gap:6}}>
                  <button onClick={refreshDebug}
                    style={{background:"none",border:"1px solid rgba(99,102,241,.3)",color:"var(--g-muted)",fontSize:10,
                      cursor:"pointer",padding:"2px 8px",borderRadius:4}}>↻ Refresh</button>
                  <button onClick={()=>setShowDebug(false)}
                    style={{background:"none",border:"none",color:"var(--g-muted)",cursor:"pointer",fontSize:12}}>✕</button>
                </div>
              </div>
              {debugLog.length===0 && (
                <div style={{fontSize:11,color:"var(--g-muted)",textAlign:"center",padding:"16px 0"}}>
                  Aucune requête IA pour l'instant. Lance une génération pour voir les logs.
                </div>
              )}
              {debugLog.map((entry,i)=>(
                <div key={i} style={{background:"var(--g-surface-2)",border:`1px solid ${entry.ok===false?"rgba(239,68,68,.3)":entry.type==="request"?"rgba(99,102,241,.25)":entry.type==="response"?"rgba(16,185,129,.25)":"rgba(99,102,241,.15)"}`,
                  borderRadius:6,padding:"8px 10px",fontSize:10,fontFamily:"'JetBrains Mono',monospace"}}>
                  <div style={{display:"flex",gap:8,marginBottom:4,alignItems:"center"}}>
                    <span style={{color: entry.type==="request"?"#818CF8":entry.type==="response"?"#34D399":entry.ok===false?"#F87171":"#A78BFA",fontWeight:700}}>
                      {entry.type==="request"?"📤 REQUÊTE":entry.type==="response"?"📥 RÉPONSE":entry.type==="parse"?"🔧 PARSING":"📋 LOG"}
                    </span>
                    <span style={{color:"var(--g-muted)"}}>{entry.ts}</span>
                    {entry.provider && <span style={{color:"var(--g-primary-light)"}}>{entry.provider} / {entry.model}</span>}
                    {entry.strategy && <span style={{color:entry.ok?"#34D399":"#F87171",fontWeight:700}}>
                      stratégie: {entry.strategy} {entry.ok?"✓":"✗"}
                    </span>}
                    {entry.promptLen && <span style={{color:"var(--g-muted)"}}>{entry.promptLen} chars</span>}
                    {entry.rawLen    && <span style={{color:"var(--g-muted)"}}>{entry.rawLen} chars reçus</span>}
                    {entry.blocsFound && <span style={{color:"#34D399"}}>{entry.blocsFound} blocs récupérés</span>}
                    {entry.svgCount  && <span style={{color:"#FBBF24"}}>{entry.svgCount} SVG extraits</span>}
                  </div>
                  {entry.errors && (
                    <div style={{color:"#F87171",fontSize:10,marginBottom:4}}>
                      {entry.errors.map((e,j)=><div key={j}>✗ {e}</div>)}
                    </div>

                    <div style={{color:"#94A3B8",lineHeight:1.6,whiteSpace:"pre-wrap",wordBreak:"break-all",maxHeight:120,overflowY:"auto",
                      background:"rgba(0,0,0,.3)",borderRadius:4,padding:"6px 8px",marginTop:4,fontSize:10}}>

          {(iaLoading || iaStep || iaErr) && (

              {(iaLoading || (iaStep && !iaErr)) && (
                <div className="ia-prog" style={{margin:0}}>
                  <div className="ia-prog-lbl">
                    <div className={iaLoading?"ia-spinner":""} style={!iaLoading?{fontSize:14}:{}}>{!iaLoading?"":""}</div>
                    <span style={{flex:1}}>{iaStep}</span>

                  </div>

                  <span style={{flex:1,lineHeight:1.5}}>{iaErr}</span>
                  <div style={{display:"flex",gap:6,flexShrink:0}}>
                    <button onClick={()=>{setShowDebug(true);refreshDebug();setIaErr("");}}
                      style={{background:"rgba(99,102,241,.15)",border:"1px solid rgba(99,102,241,.3)",color:"#A5B4FC",
                        borderRadius:4,padding:"3px 8px",cursor:"pointer",fontSize:10,fontWeight:700,whiteSpace:"nowrap"}}>

                    </button>
                    <button onClick={()=>setIaErr("")}

                  </div>
                </div>
              )}
            </div>
          )}
          {/* Onglets */}
          <div className="g-editor-tabs">
            {[
              {id:"lesson", label:"📚 Leçon"},
              {id:"blocks", label:"🧱 Blocs"},
              {id:"levels", label:"🎯 Niveaux"},
              {id:"code",   label:"💻 Code"},
            ].map(t=>(
              <button key={t.id} className={`g-editor-tab ${tab===t.id?"active":""}`}
                onClick={()=>setTab(t.id)}>{t.label}</button>
            ))}
          </div>

          {/* Corps */}
          <div className="g-editor-body">

            {/* ── Leçon ── */}
            {tab==="lesson" && (
              <div style={{display:"flex",flexDirection:"column",gap:16}}>
                <div className="g-field-group">
                  <div className="g-field-label">Formule / Résumé clé</div>
                  <input className="g-field" value={n.lesson.formula}
                    placeholder="ex : F'(x) = f(x) sur I ⟺ F est une primitive de f"
                    onChange={e=>setLesson("formula",e.target.value)}/>
                </div>
                <div className="g-field-group">
                  <div className="g-field-label">Texte de la leçon (3-4 phrases)</div>
                  <textarea className="g-field" value={n.lesson.text} rows={6}
                    placeholder="Définition + mécanisme/propriétés + importance dans le chapitre…"
                    onChange={e=>setLesson("text",e.target.value)}/>
                </div>
                <div className="g-field-group">
                  <div className="g-field-label">Exemple illustratif</div>
                  <textarea className="g-field" value={n.lesson.example} rows={3}
                    placeholder="Un exemple concret avec résultat…"
                    onChange={e=>setLesson("example",e.target.value)}/>
                </div>
              </div>
            )}

            {/* ── Blocs ── */}
            {tab==="blocks" && (
              <div>
                <div className="g-block-adder">
                  <div className="g-block-adder-title">Ajouter un bloc</div>
                  <div className="g-block-chips">
                    {BLOCK_TYPES.map(bt=>(
                      <button key={bt.type} className="g-block-chip-btn"
                        style={{borderColor:bt.color+"55",color:bt.color,background:bt.color+"12"}}
                        onClick={()=>addBlock(bt.type)}>
                        {bt.icon} {bt.label}
                      </button>
                    ))}
                  </div>
                </div>
                {n.fullBlocks.length===0 && (
                  <div className="ia-empty-cta">
                    <div className="ia-empty-cta__ico">🤖</div>
                    <div className="ia-empty-cta__ttl">Aucun bloc de cours</div>
                    <div className="ia-empty-cta__sub">
                      Génère automatiquement les blocs (définition, formule, exemple, SVG…) pour «{n.label}»
                    </div>
                    {iaLoading ? (
                      <div className="ia-prog" style={{margin:"0 auto",maxWidth:320}}>
                        <div className="ia-prog-lbl"><div className="ia-spinner"/>{iaStep}</div>
                        <div className="ia-prog-bar"><div className="ia-prog-fill" style={{width:iaPct+"%"}}/></div>
                      </div>
                    ) : (
                      <button className="g-btn-ia g-btn-ia-sm" onClick={genCours} disabled={iaLoading}>
                        🤖 Générer le cours avec l'IA
                      </button>
                    )}
                    {iaErr && <div style={{marginTop:8,fontSize:11,color:"#F87171"}}>❌ {iaErr}</div>}
                  </div>
                )}
                {n.fullBlocks.map((block,idx)=>(
                  <BlockEditor key={block._id||idx} block={block} idx={idx} total={n.fullBlocks.length}
                    onChange={b=>{
                      const bl=[...n.fullBlocks]; bl[idx]=b;
                      updBlocks(bl);
                    }}
                    onDelete={()=>updBlocks(n.fullBlocks.filter((_,i)=>i!==idx))}
                    onUp={()=>{
                      if(idx<=0) return;
                      const bl=[...n.fullBlocks];
                      [bl[idx-1],bl[idx]]=[bl[idx],bl[idx-1]];
                      updBlocks(bl);
                    }}
                    onDown={()=>{
                      if(idx>=n.fullBlocks.length-1) return;
                      const bl=[...n.fullBlocks];
                      [bl[idx],bl[idx+1]]=[bl[idx+1],bl[idx]];
                      updBlocks(bl);
                    }}
                  />
                ))}
              </div>
            )}

            {/* ── Niveaux ── */}
            {tab==="levels" && (
              <div>
                {!hasExos && (
                  <div className="ia-empty-cta">
                    <div className="ia-empty-cta__ico">🎯</div>
                    <div className="ia-empty-cta__ttl">Aucun exercice</div>
                    <div className="ia-empty-cta__sub">
                      Génère 40 exercices progressifs sur «{n.label}» répartis en 6 niveaux (10q × N1-N3 + 5q × N4-N6)
                    </div>
                    {iaLoading ? (
                      <div className="ia-prog" style={{margin:"0 auto",maxWidth:320}}>
                        <div className="ia-prog-lbl"><div className="ia-spinner"/>{iaStep}</div>
                        <div className="ia-prog-bar"><div className="ia-prog-fill" style={{width:iaPct+"%"}}/></div>
                      </div>
                    ) : (
                      <button className="g-btn-ia g-btn-ia-sm" onClick={genExos} disabled={iaLoading}>
                        🤖 Générer les exercices avec l'IA
                      </button>
                    )}
                    {iaErr && <div style={{marginTop:8,fontSize:11,color:"#F87171"}}>❌ {iaErr}</div>}
                  </div>
                )}
                <p style={{fontSize:11,color:"var(--g-muted)",marginBottom:14,lineHeight:1.6}}>
                  Aperçu des 6 niveaux de questions.
                </p>
                {n.levels.map((lvl,li)=>(
                  <div key={li} className="g-level-row" style={{flexDirection:"column",alignItems:"stretch",gap:0,padding:0,overflow:"hidden"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,padding:"7px 13px",background:"var(--g-surface-2)"}}>
                      <span style={{fontSize:10,fontWeight:900,color:"var(--g-primary-light)",background:"rgba(99,102,241,.18)",borderRadius:4,padding:"2px 8px"}}>N{li+1}</span>
                      <span style={{fontSize:11,color:"var(--g-text-2)"}}>{Array.isArray(lvl)?lvl.length:0} questions</span>
                      <span style={{fontSize:9,marginLeft:"auto",color:li<3?"#FBBF24":"#A78BFA",fontWeight:700}}>{li<3?"Fondamental":"Problèmes"}</span>
                    </div>
                    {Array.isArray(lvl)&&lvl.slice(0,2).map((q,qi)=>(
                      <div key={qi} className="g-level-q">
                        <span className="g-level-q__type">[{q.type}]</span>
                        {(q.question||"").slice(0,88)}{(q.question||"").length>88?"…":""}
                      </div>
                    ))}
                    {Array.isArray(lvl)&&lvl.length>2&&(
                      <div style={{padding:"4px 13px",fontSize:10,color:"var(--g-muted)"}}>+{lvl.length-2} autres questions…</div>
                    )}
                  </div>
                ))}
              </div>
            )}

            {/* ── Code ── */}
            {tab==="code" && (
              <div>
                <div style={{display:"flex",gap:8,marginBottom:12}}>
                  <button className="g-btn g-btn-ghost g-btn-sm"
                    onClick={()=>navigator.clipboard.writeText(exportNotionJS(n,chapterId))}>
                    📋 Copier le code
                  </button>
                  <button className="g-btn g-btn-ghost g-btn-sm" onClick={handleDl}>
                    💾 Télécharger .js
                  </button>
                </div>
                <pre className="g-code-block"><code>{exportNotionJS(n,chapterId)}</code></pre>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // NOTION CARD
    // ══════════════════════════════════════════════════
    function NotionCard({notion, index, onEdit, onCtx}) {
      const blocks = notion.fullBlocks||[];
      const byType = blocks.reduce((a,b)=>{a[b.type]=(a[b.type]||0)+1;return a;},{});
      const totalQ = notion.levels.reduce((s,l)=>s+(Array.isArray(l)?l.length:0),0);
      const isComplete = notion.lesson?.text && blocks.length>0;
      const statusColor = notion._isL1 ? "#EC4899"
        : isComplete ? "var(--g-success)"
        : blocks.length>0 ? "var(--g-warning)"
        : "var(--g-muted)";
      return (
        <div className={`g-notion-card ${notion._isL1?"l1":""}`}
          onContextMenu={onCtx} onClick={onEdit}>
          <div className="g-notion-card__header">
            <div className="g-notion-card__num">{index+1}</div>
            <div className="g-notion-card__name">
              {notion.label}
              {notion._isL1&&<span className="g-badge-l1" style={{marginLeft:6}}>L1</span>}
              {notion._new&&<span className="g-badge-new" style={{marginLeft:6}}>NEW</span>}
            </div>
            <div className="g-notion-card__status" style={{background:statusColor}}/>
          </div>
          {notion.lesson?.text && (
            <div className="g-notion-card__text">{notion.lesson.text}</div>
          )}
          <div className="g-notion-card__blocks">
            {blocks.length===0
              ? <span style={{fontSize:10,color:"var(--g-muted)"}}>Aucun bloc</span>
              : Object.entries(byType).map(([type,count])=>{
                  const bt=BT[type];
                  return bt
                    ? <span key={type} className="g-notion-card__block-chip"
                        style={{background:`${bt.color}18`,border:`1px solid ${bt.color}35`,color:bt.color}}>
                        {bt.icon} {count}
                      </span>
                    : null;
                })
            }
            {totalQ>0 && <span className="g-notion-card__qcount">{totalQ}q</span>}
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // CHAPTER VIEW
    // ══════════════════════════════════════════════════
    function ChapterView({merged, levelId, subjectId, chapterId, onCreateNotion, onEditNotion, onNotionCtx, onDownload}) {
      const ch = merged?.[levelId]?.subjects[subjectId]?.chapters.find(c=>c.id===chapterId);
      if (!ch) return null;
      const allN = [...(ch.notions||[]), ...(ch.l1Notions||[])];
      const complete = allN.filter(n=>n.fullBlocks?.length>0&&n.lesson?.text).length;
      const blocks   = allN.reduce((s,n)=>s+(n.fullBlocks||[]).length,0);
      const qs       = allN.reduce((s,n)=>s+n.levels.reduce((a,l)=>a+(Array.isArray(l)?l.length:0),0),0);
      const pct = allN.length>0 ? Math.round(complete/allN.length*100) : 0;

      return (
        <div className="g-chapter-view">
          <div className="g-chapter-header">
            <div style={{display:"flex",alignItems:"center",gap:14}}>
              <div className="g-chapter-icon">{ch.icon||"📚"}</div>
              <div>
                <div className="g-chapter-title">{ch.label}</div>
                {ch.description && <div className="g-chapter-desc">{ch.description}</div>}
                <div className="g-chapter-meta">
                  <span style={{color:"var(--g-primary-light)"}}>{allN.length} notions</span>
                  <span style={{color:"var(--g-success)"}}>{complete} complètes</span>
                  <span style={{color:"var(--g-warning)"}}>{blocks} blocs</span>
                  <span style={{color:"var(--g-text-2)"}}>{qs} questions</span>
                </div>
              </div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button className="g-btn g-btn-ghost g-btn-sm" onClick={onDownload}>💾 Exporter .js</button>
              <button className="g-btn g-btn-primary g-btn-sm" onClick={onCreateNotion}>➕ Nouvelle notion</button>
            </div>
          </div>

          <div style={{marginBottom:4,display:"flex",justifyContent:"space-between",fontSize:11,color:"var(--g-muted)"}}>
            <span>Progression du chapitre</span><span style={{fontWeight:700}}>{pct}%</span>
          </div>
          <div className="g-progress-bar" style={{marginBottom:28}}>
            <div className="g-progress-fill" style={{width:`${pct}%`}}/>
          </div>

          {allN.length===0 ? (
            <div className="g-empty">
              <div className="g-empty__icon">🌱</div>
              <div className="g-empty__text">Aucune notion dans ce chapitre</div>
              <button className="g-btn g-btn-primary g-btn-sm" onClick={onCreateNotion}>➕ Créer une notion</button>
            </div>
          ) : (
            <div className="g-notions-grid">
              {allN.map((n,i)=>(
                <NotionCard key={n.id} notion={n} index={i}
                  onEdit={()=>onEditNotion(n)}
                  onCtx={e=>onNotionCtx(e,n.id,!!n._new)}/>
              ))}
            </div>
          )}
        </div>
      );
    }

              📂 Synchronisation avec le dossier local
            </div>
