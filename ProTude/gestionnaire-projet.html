    // ══════════════════════════════════════════════════
    // SIDEBAR TREE
    // ══════════════════════════════════════════════════
    function SidebarTree({merged, selected, onSelect, onEdit, ctxMenu, panelWidth, onSplitDrag,
      onCreateLevel, onCreateSubject, onCreateChapter, onCreateNotion,
      setModal, localEdits, newNotions
    }) {
      return (
        <div className="g-sidebar" style={{width:panelWidth}}>
          {/* Bouton créer niveau */}
          <div style={{padding:"8px 14px 4px",display:"flex",justifyContent:"flex-end"}}>
            <button className="g-btn g-btn-ghost g-btn-sm" onClick={onCreateLevel}
              title="Nouveau niveau scolaire" style={{fontSize:11,padding:"4px 10px"}}>
              ➕ Niveau
            </button>
          </div>

          {Object.values(merged).map(level=>{
            const isSelLevel = selected?.type==="level" && selected?.levelId===level.id;
            return (
              <div key={level.id} className="g-tree-level">
                <div className="g-tree-level-header" style={{color:level.color}}>
                  <span>{level.label}</span>
                  <div style={{display:"flex",gap:4}}>
                    <button onClick={()=>onCreateSubject(level.id,level.label)}
                      title="Nouvelle matière" style={{color:level.color}}>➕ Matière</button>
                  </div>
                </div>

                {Object.values(level.subjects||{}).map(subj=>(
                  <div key={subj.id}>
                    <div className="g-tree-subject-header">
                      <span style={{fontSize:15}}>{subj.icon}</span>
                      <span style={{flex:1}}>{subj.label}</span>
                      <button className="g-add-btn"
                        onClick={()=>onCreateChapter(level.id,subj.id)}
                        title="Nouveau chapitre">+</button>
                    </div>

                    {(subj.chapters||[]).map(ch=>{
                      const isNew = !!ch._new;
                      const isSelCh = selected?.type==="chapter" && selected?.chapterId===ch.id;
                      const allN = [...(ch.notions||[]),...(ch.l1Notions||[])];
                      return (
                        <div key={ch.id}>
                          <div className={`g-tree-chapter ${isSelCh?"active":""}`}
                            onClick={()=>onSelect({type:"chapter",levelId:level.id,subjectId:subj.id,chapterId:ch.id})}
                            onContextMenu={e=>ctxMenu.open(e, [
                              ...(isNew?[{icon:"📝",label:"Renommer",action:()=>setModal({type:"rename-chapter",levelId:level.id,subjectId:subj.id,chapterId:ch.id,current:ch.label})}]:[]),
                              {icon:"➕",label:"Ajouter une notion",action:()=>onCreateNotion(level.id,subj.id,ch.id,ch.label)},
                              "sep",
                              {icon:"💾",label:"Exporter .js",action:()=>{ const js=exportChapterJS(ch,subj.id,level.id); dl(js,ch.id+".js"); }},
                              ...(isNew?["sep",{icon:"🗑️",label:"Supprimer",danger:true,action:()=>setModal({type:"delete-chapter",levelId:level.id,subjectId:subj.id,chapterId:ch.id,label:ch.label})}]:[]),
                            ])}>
                            <span className="g-tree-chapter__icon">{ch.icon||"📚"}</span>
                            <span className="g-tree-chapter__label">{ch.label}</span>
                            {isNew&&<span className="g-badge-new">NEW</span>}
                            <span className="g-tree-chapter__count">{allN.length}</span>
                            <button className="g-tree-chapter__add"
                              onClick={e=>{e.stopPropagation();onCreateNotion(level.id,subj.id,ch.id,ch.label);}}>
                              +
                            </button>
                          </div>

                          {allN.map(notion=>{
                            const isNNew = !!notion._new;
                            const isSelN = selected?.notionId===notion.id && selected?.chapterId===ch.id;
                            const hasBl = (notion.fullBlocks||[]).length>0;
                            const hasLess = !!notion.lesson?.text;
                            const dotColor = notion._isL1 ? "#EC4899"
                              : (hasBl&&hasLess) ? "var(--g-success)"
                              : hasBl ? "var(--g-warning)"
                              : "var(--g-muted)";
                            return (
                              <div key={notion.id}
                                className={`g-tree-notion ${isSelN?"active":""}`}
                                onClick={()=>onEdit(notion,level.id,subj.id,ch.id)}
                                onContextMenu={e=>ctxMenu.open(e, [
                                  {icon:"✏️",label:"Éditer",action:()=>onEdit(notion,level.id,subj.id,ch.id)},
                                  ...(isNNew?[{icon:"📝",label:"Renommer",action:()=>setModal({type:"rename-notion",levelId:level.id,subjectId:subj.id,chapterId:ch.id,notionId:notion.id,current:notion.label})}]:[]),
                                  "sep",
                                  {icon:"💾",label:"Exporter .js",action:()=>{ const js=exportNotionJS(notion,ch.id); dl(js,notion.id+".js"); }},
                                  ...(isNNew?["sep",{icon:"🗑️",label:"Supprimer",danger:true,action:()=>setModal({type:"delete-notion",levelId:level.id,subjectId:subj.id,chapterId:ch.id,notionId:notion.id,label:notion.label})}]:[]),
                                ])}>
                                <div className="g-tree-notion__dot" style={{background:dotColor}}/>
                                <span className="g-tree-notion__label">{notion.label}</span>
                                <span className="g-tree-notion__info">{(notion.fullBlocks||[]).length}b</span>
                                {notion._isL1&&<span className="g-badge-l1">L1</span>}
                                {isNNew&&<span className="g-badge-new">N</span>}
                              </div>
                            );
                          })}
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // APP PRINCIPAL
    // ══════════════════════════════════════════════════
    function App() {
      const [structure,    setStructure]    = useState({});   // FIXE: {} au lieu de null pour archi dynamique
      const [localEdits,   setLocalEdits]   = useState({});
      const [newChapters,  setNewChapters]  = useState({});
      const [newNotions,   setNewNotions]   = useState({});
      const [newLevels,    setNewLevels]    = useState({});   // { levelId: levelObj }
      const [newSubjects,  setNewSubjects]  = useState({});   // { "levelId|subjectId": subjectObj }
      const [selected,     setSelected]     = useState(null);
      const [editingNotion,setEditingNotion]= useState(null); // {notion, levelId, subjectId, chapterId}
      const [modal,        setModal]        = useState(null);
      const [toast,        setToast]        = useState("");
      const [panelWidth,   setPanelWidth]   = useState(280);
      const [splDrag,      setSplDrag]      = useState(false);
      const [exportProg,   setExportProg]   = useState(null); // null | {done,total,last}
      const [folderHandle, setFolderHandle] = useState(null); // FileSystemDirectoryHandle
      const [folderName,   setFolderName]   = useState("");
      const [fsStatus,     setFsStatus]     = useState("idle"); // idle | saving | saved | error
      const fsStatusTimer  = React.useRef(null);
      const mergedRef      = React.useRef({});   // toujours à jour, sans déclencher de re-render
      const isSyncingRef   = React.useRef(false); // vrai pendant loadFromFolder → bloque les writes auto
      const folderHandleRef = React.useRef(null);  // ref de folderHandle pour les effects async
      const ctxMenu = useCtxMenu();

      const showToast = msg => { setToast(msg); setTimeout(()=>setToast(""),2400); };

      // ── File System helpers ───────────────────────────
      const setFsOk  = () => { setFsStatus("saved");  clearTimeout(fsStatusTimer.current); fsStatusTimer.current=setTimeout(()=>setFsStatus("idle"),2000); };
      const setFsErr = () => { setFsStatus("error");  clearTimeout(fsStatusTimer.current); fsStatusTimer.current=setTimeout(()=>setFsStatus("idle"),4000); };
      const setFsSaving = () => { setFsStatus("saving"); };

      const slugifyFS = s => s.toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
        .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

      // Obtient (ou crée) le sous-dossier niveau/matière/chapitre
      // Retourne le handle du dossier chapitre (le crée si besoin)
      // Accepte des labels explicites pour ne pas dépendre de `merged` (closure potentiellement stale)
      const getChapterDir = async (fh, levelId, subjectId, chapterId, labels={}) => {
        // labels = { levelLabel, subjLabel, chLabel } — fallback sur les IDs si absent
        const levelSlug = slugifyFS(labels.levelLabel || levelId);
        const subjSlug  = slugifyFS(labels.subjLabel  || subjectId);
        const chSlug    = slugifyFS(labels.chLabel    || chapterId);
        const lDir = await fh.getDirectoryHandle(levelSlug, { create:true });
        const sDir = await lDir.getDirectoryHandle(subjSlug, { create:true });
        const cDir = await sDir.getDirectoryHandle(chSlug,   { create:true });
        return cDir;
      };

      const fsWriteFile = async (dirHandle, filename, text) => {
        const fh = await dirHandle.getFileHandle(filename, { create:true });
        const w  = await fh.createWritable();
        await w.write(text);
        await w.close();
      };

      const fsDeleteFile = async (dirHandle, filename) => {
        try { await dirHandle.removeEntry(filename); } catch {}
      };

      // Réécrit index.js du chapitre avec toutes ses notions dedans
      const fsSaveNotion = async (levelId, subjectId, chapterId, _notion, mergedSnapshot) => {
        const fh = folderHandleRef.current;
        if (!fh) return;
        try {
          setFsSaving();
          const snap = mergedSnapshot || mergedRef.current;
          const lvl  = snap?.[levelId];
          const subj = lvl?.subjects?.[subjectId];
          const ch   = subj?.chapters?.find(c=>c.id===chapterId);
          if (!ch) { setFsOk(); return; }
          const labels = { levelLabel: lvl?.label, subjLabel: subj?.label, chLabel: ch?.label };
          const cDir = await getChapterDir(fh, levelId, subjectId, chapterId, labels);
          await fsWriteFile(cDir, "index.js", exportChapterJS(ch, subjectId, levelId));
          setFsOk();
        } catch(e) { console.error("fsSaveNotion",e); setFsErr(); }
      };

      // Après suppression d'une notion, réécrit index.js (merged est déjà à jour)
      const fsDeleteNotion = async (levelId, subjectId, chapterId, _notionId, _notionLabel) => {
        const fh = folderHandleRef.current;
        if (!fh) return;
        try {
          setFsSaving();
          const lvl  = mergedRef.current?.[levelId];
          const subj = lvl?.subjects?.[subjectId];
          const ch   = subj?.chapters?.find(c=>c.id===chapterId);
          if (!ch) { setFsOk(); return; }
          const labels = { levelLabel: lvl?.label, subjLabel: subj?.label, chLabel: ch?.label };
          const cDir = await getChapterDir(fh, levelId, subjectId, chapterId, labels);
          await fsWriteFile(cDir, "index.js", exportChapterJS(ch, subjectId, levelId));
          setFsOk();
        } catch(e) { console.error("fsDeleteNotion",e); setFsErr(); }
      };

      const fsSaveChapterIndex = async (levelId, subjectId, chapterId) => {
        if (!folderHandle) return;
        try {
          setFsSaving();
          const cDir = await getChapterDir(folderHandle, levelId, subjectId, chapterId);
          const ch = merged?.[levelId]?.subjects?.[subjectId]?.chapters?.find(c=>c.id===chapterId);
          if (ch) await fsWriteFile(cDir, "index.js", exportChapterJS(ch, subjectId, levelId));
          setFsOk();
        } catch(e) { console.error("fsSaveChapterIndex",e); setFsErr(); }
      };

      const isInIframe = window !== window.top;

      // ── Charger le contenu existant depuis le dossier ──
      const loadFromFolder = async (rootHandle) => {
        // Bloquer les auto-writes pendant le chargement
        isSyncingRef.current = true;
        // Parse un index.js : extrait l'objet après "export default"
        const parseIndexJS = (text) => {
          try {
            // Retirer commentaires de tête et "export default"
            // Note: on utilise new RegExp pour éviter les problèmes de parsing Babel avec les regex multilignes
            const reLineComment = new RegExp('\\/\\/[^\\n]*', 'g');
            const reBlockComment = new RegExp('\\/\\*[\\s\\S]*?\\*\\/', 'g');
            const reExportDefault = new RegExp('export\\s+default\\s+');
            const reTrailingSemi = new RegExp(';?\\s*$');
            const cleaned = text
              .replace(reLineComment, "")
              .replace(reBlockComment, "")
              .replace(reExportDefault, "")
              .trim()
              .replace(reTrailingSemi, "");
            // eslint-disable-next-line no-new-func
            return new Function("return (" + cleaned + ")")();
          } catch(e) {
            console.warn("parseIndexJS error:", e.message);
            return null;
          }
        };

        const loadedLevels  = {};  // { levelId: levelObj }
        const loadedSubjects = {}; // { "levelId|subjectId": subjObj }
        const loadedChapters = {}; // { "levelId|subjectId": [ch, ...] }
        let total = 0, loaded = 0;

        // Parcourir niveau/
        for await (const [levelName, levelDir] of rootHandle.entries()) {
          if (levelDir.kind !== "directory") continue;
          const levelId    = levelName;
          const levelLabel = levelName.replace(/-/g," ").replace(/\w/g,c=>c.toUpperCase());
          loadedLevels[levelId] = { id:levelId, label:levelLabel, color:"#4F46E5", subjects:{} };

          // Parcourir matière/
          for await (const [subjName, subjDir] of levelDir.entries()) {
            if (subjDir.kind !== "directory") continue;
            const subjectId    = subjName;
            const subjectLabel = subjName.replace(/-/g," ").replace(/\w/g,c=>c.toUpperCase());
            const subjKey = levelId+"|"+subjectId;
            loadedSubjects[subjKey] = { id:subjectId, label:subjectLabel, icon:"📚", chapters:[] };
            loadedChapters[subjKey] = [];

            // Parcourir chapitre/
            for await (const [chName, chDir] of subjDir.entries()) {
              if (chDir.kind !== "directory") continue;
              total++;
            }
          }
        }

        // 2e passe : lire les index.js maintenant qu'on a le total
        for await (const [levelName, levelDir] of rootHandle.entries()) {
          if (levelDir.kind !== "directory") continue;
          const levelId = levelName;

          for await (const [subjName, subjDir] of levelDir.entries()) {
            if (subjDir.kind !== "directory") continue;
            const subjectId = subjName;
            const subjKey = levelId+"|"+subjectId;

            for await (const [chName, chDir] of subjDir.entries()) {
              if (chDir.kind !== "directory") continue;
              const chapterId = chName;

              try {
                const fileHandle = await chDir.getFileHandle("index.js");
                const file = await fileHandle.getFile();
                const text = await file.text();
                const obj  = parseIndexJS(text);
                if (!obj) { loaded++; continue; }

                // Reconstruire le chapitre dans la structure interne
                const ch = {
                  id:          obj.id || chapterId,
                  label:       obj.title || obj.label || chName.replace(/-/g," "),
                  icon:        obj.icon  || "📚",
                  description: obj.description || "",
                  xpMax:       obj.xpMax || 200,
                  _new:        true, // marqué _new = éditable
                  notions: (obj.notions||[]).map(n=>({
                    id:         n.id,
                    label:      n.label,
                    icon:       n.icon  || "📌",
                    lesson:     n.lesson || {formula:"",text:"",example:""},
                    fullBlocks: (n.fullBlocks||[]).map((b,i)=>({...b,_id:b._id||genId()+i})),
                    levels:     n.levels || Array(6).fill([]),
                    _new:       true,
                  })),
                  l1Notions: (obj.l1Bonus?.notions||[]).map(n=>({
                    id:         n.id,
                    label:      n.label,
                    icon:       n.icon  || "📌",
                    lesson:     n.lesson || {formula:"",text:"",example:""},
                    fullBlocks: (n.fullBlocks||[]).map((b,i)=>({...b,_id:b._id||genId()+i})),
                    levels:     n.levels || Array(6).fill([]),
                    _new:       true, _isL1:true,
                  })),
                };

                if (!loadedChapters[subjKey]) loadedChapters[subjKey] = [];
                loadedChapters[subjKey].push(ch);
              } catch(e) {
                console.warn("Impossible de lire", chName+"/index.js", e.message);
              }
              loaded++;
            }
          }
        }

        if (loaded === 0) {
          showToast("📂 Dossier vide — prêt pour la synchronisation");
          return;
        }

        // Injecter dans les states React
        // On calcule d'abord l'état final pour pré-remplir les prevXxx.current
        // et empêcher les useEffect de traiter les éléments chargés comme "nouveaux à écrire"
        let finalNewChapters = {};
        let finalNewNotions  = {};

        setNewLevels(prev => {
          const next = {...prev};
          Object.entries(loadedLevels).forEach(([id, lvl]) => {
            if (!next[id]) next[id] = lvl;
          });
          return next;
        });
        setNewSubjects(prev => {
          const next = {...prev};
          Object.entries(loadedSubjects).forEach(([key, subj]) => {
            if (!next[key]) next[key] = subj;
          });
          return next;
        });
        setNewChapters(prev => {
          const next = {...prev};
          Object.entries(loadedChapters).forEach(([key, chs]) => {
            if (!next[key]) next[key] = [];
            const existing = new Set(next[key].map(c=>c.id));
            const toAdd = chs.filter(c=>!existing.has(c.id));
            if (toAdd.length) next[key] = [...next[key], ...toAdd];
          });
          finalNewChapters = next;
          return next;
        });

        // Pré-remplir prevNewChapters et prevNewNotions AVANT que les effects se lancent
        // → les elements chargés ne seront pas vus comme "ajouts" → pas d'écriture parasite
        prevNewChapters.current = finalNewChapters;
        prevNewNotions.current  = finalNewNotions;

        const chCount = Object.values(loadedChapters).flat().length;
        const nCount  = Object.values(loadedChapters).flat()
          .reduce((s,ch)=>s+(ch.notions||[]).length+(ch.l1Notions||[]).length, 0);

        // Libérer le verrou de sync après un tick (React a fini ses re-renders)
        setTimeout(() => { isSyncingRef.current = false; }, 200);

        showToast(`✅ Chargé : ${chCount} chapitre(s), ${nCount} notion(s)`);
      };

      const requestFolderAccess = async () => {
        if (!window.showDirectoryPicker) {
          showToast("❌ showDirectoryPicker non disponible — utilisez Chrome ou Edge v86+");
          return;
        }
        try {
          const handle = await window.showDirectoryPicker({ mode:"readwrite", startIn:"documents" });
          // Marquer comme en cours de chargement AVANT de set le handle
          // pour que les useEffect ne traitent pas les états existants comme "nouveaux"
          isSyncingRef.current = true;
          setFolderHandle(handle);
          setFolderName(handle.name);
          folderHandleRef.current = handle;
          showToast("📂 Dossier «"+handle.name+"» connecté — chargement en cours…");
          // Charger le contenu existant (pré-remplit aussi prevXxx.current)
          await loadFromFolder(handle);
        } catch(e) {
          isSyncingRef.current = false;
          if (e.name !== "AbortError") showToast("❌ "+e.message);
        }
      };

      // ── Réception des données depuis index.html ──────
      useEffect(()=>{
        if (window !== window.top) window.parent.postMessage({type:"REQUEST_SUBJECTS"},"*");
        const h = e => {
          if (e.data?.type==="SUBJECTS_DATA" && e.data.subjects) {
            try { setStructure(subjectsToProject(e.data.subjects)); }
            catch(err) { console.error("subjectsToProject error:",err); }
          }
        };
        window.addEventListener("message",h);
        return ()=>window.removeEventListener("message",h);
      },[]);

      // ── Structure fusionnée (données réelles + additions) ──
      const merged = useMemo(()=>{
        const s = JSON.parse(JSON.stringify(structure || {}));

        // Nouveaux niveaux
        Object.values(newLevels).forEach(lvl=>{
          if (!s[lvl.id]) s[lvl.id] = { id:lvl.id, label:lvl.label, color:lvl.color, subjects:{} };
        });

        // Nouvelles matières
        Object.entries(newSubjects).forEach(([key,subj])=>{
          const [levelId] = key.split("|");
          if (!s[levelId]) return;
          if (!s[levelId].subjects[subj.id])
            s[levelId].subjects[subj.id] = { ...subj, chapters:[] };
        });

        // Nouveaux chapitres
        Object.entries(newChapters).forEach(([key,chs])=>{
          const [levelId,subjectId] = key.split("|");
          if (s[levelId]?.subjects[subjectId])
            s[levelId].subjects[subjectId].chapters.push(...chs);
        });

        // Nouvelles notions
        Object.entries(newNotions).forEach(([key,notions])=>{
          const [levelId,subjectId,chapterId] = key.split("|");
          const ch = s[levelId]?.subjects[subjectId]?.chapters.find(c=>c.id===chapterId);
          if (ch) ch.notions.push(...notions);
        });

        // Éditions locales
        Object.entries(localEdits).forEach(([key,edited])=>{
          const [levelId,subjectId,chapterId,notionId] = key.split("|");
          const ch = s[levelId]?.subjects[subjectId]?.chapters.find(c=>c.id===chapterId);
          if (!ch) return;
          const ni = ch.notions.findIndex(n=>n.id===notionId);
          if (ni>=0) ch.notions[ni] = edited;
          else {
            const ni2 = (ch.l1Notions||[]).findIndex(n=>n.id===notionId);
            if (ni2>=0) ch.l1Notions[ni2] = edited;
          }
        });

        return s;
      },[structure,newLevels,newSubjects,newChapters,newNotions,localEdits]);

      // Garder les refs toujours synchrones
      mergedRef.current       = merged;
      folderHandleRef.current = folderHandle;

      // ── Auto-sync vers le dossier local ───────────────
      // Surveille les éditions de notions → écrit le fichier correspondant
      const prevLocalEdits = React.useRef({});
      useEffect(()=>{
        const fh = folderHandleRef.current;
        if (!fh || isSyncingRef.current) return;
        const prev = prevLocalEdits.current;
        for (const key of Object.keys(localEdits)) {
          if (JSON.stringify(localEdits[key]) !== JSON.stringify(prev[key])) {
            const [levelId,subjectId,chapterId] = key.split("|");
            fsSaveNotion(levelId, subjectId, chapterId, localEdits[key], mergedRef.current);
          }
        }
        prevLocalEdits.current = localEdits;
      // eslint-disable-next-line react-hooks/exhaustive-deps
      },[localEdits]);

      // Surveille les nouvelles notions → crée le fichier squelette
      const prevNewNotions = React.useRef({});
      useEffect(()=>{
        const fh = folderHandleRef.current;
        if (!fh || isSyncingRef.current) return;
        const prev = prevNewNotions.current;
        for (const key of Object.keys(newNotions)) {
          const cur = newNotions[key]||[];
          const old = prev[key]||[];
          const added = cur.filter(n=>!old.find(o=>o.id===n.id));
          if (added.length > 0) {
            const [levelId,subjectId,chapterId] = key.split("|");
            added.forEach(n => fsSaveNotion(levelId, subjectId, chapterId, n, mergedRef.current));
          }
        }
        prevNewNotions.current = newNotions;
      // eslint-disable-next-line react-hooks/exhaustive-deps
      },[newNotions]);

      // Surveille les nouveaux chapitres → crée le dossier + index.js
      const prevNewChapters = React.useRef({});
      useEffect(()=>{
        if (!folderHandle || isSyncingRef.current) return;
        const prev = prevNewChapters.current;
        for (const key of Object.keys(newChapters)) {
          const cur = newChapters[key]||[];
          const old = prev[key]||[];
          const added = cur.filter(c=>!old.find(o=>o.id===c.id));
          if (added.length > 0) {
            const [levelId,subjectId] = key.split("|");
            added.forEach(ch => {
              (async()=>{
                try {
                  setFsSaving();
                  const snap = mergedRef.current;
                  const lvl  = snap[levelId];
                  const subj = lvl?.subjects?.[subjectId];
                  const labels = { levelLabel: lvl?.label, subjLabel: subj?.label, chLabel: ch.label };
                  const cDir = await getChapterDir(fh, levelId, subjectId, ch.id, labels);
                  await fsWriteFile(cDir, "index.js", exportChapterJS(ch, subjectId, levelId));
                  setFsOk();
                } catch(e) { console.error("chapter index write",e); setFsErr(); }
              })();
            });
          }
        }
        prevNewChapters.current = newChapters;
      // eslint-disable-next-line react-hooks/exhaustive-deps
      },[newChapters]);

      // ── Stats ─────────────────────────────────────────
      const stats = useMemo(()=>{
        if (!merged) return {chapters:0,notions:0,blocks:0};
        let chapters=0,notions=0,blocks=0;
        Object.values(merged).forEach(lvl=>
          Object.values(lvl.subjects||{}).forEach(subj=>
            (subj.chapters||[]).forEach(ch=>{
              chapters++;
              [...(ch.notions||[]),...(ch.l1Notions||[])].forEach(n=>{
                notions++;
                blocks += (n.fullBlocks||[]).length;
              });
            })
          )
        );
        return {chapters,notions,blocks};
      },[merged]);

      // ── Créer niveau ──────────────────────────────────
      const createLevel = ({label, color}) => {
        const id = slugify(label)||genId();
        setNewLevels(p=>({...p,[id]:{id,label,color:color||"#4F46E5",subjects:{}}}));
        showToast(`Niveau «${label}» créé`); setModal(null);
      };

      // ── Créer matière ─────────────────────────────────
      const createSubject = (levelId, {label, icon}) => {
        const id = slugify(label)||genId();
        const key = `${levelId}|${id}`;
        setNewSubjects(p=>({...p,[key]:{id,label,icon:icon||"📚",chapters:[]}}));
        // Garder le contexte actuel (ne pas changer selected)
        showToast(`Matière «${label}» créée`); setModal(null);
      };

      // ── Créer chapitre ────────────────────────────────
      const createChapter = (levelId, subjectId, {label, icon}) => {
        const id = slugify(label)||genId();
        const ch = {id,label,icon,description:"",notions:[],l1Notions:[],_new:true};
        const key = `${levelId}|${subjectId}`;
        setNewChapters(p=>({...p,[key]:[...(p[key]||[]),ch]}));
        // Auto-sélectionner le chapitre créé pour rester dans le contexte
        setSelected({type:"chapter", levelId, subjectId, chapterId:id});
        setEditingNotion(null);
        showToast(`Chapitre «${label}» créé`); setModal(null);
      };

      // ── Créer notion ──────────────────────────────────
      const createNotion = (levelId, subjectId, chapterId, label) => {
        const id = slugify(label)||genId();
        const n = {id,label,icon:"📌",_new:true,lesson:{formula:"",text:"",example:""},fullBlocks:[],levels:Array(6).fill([])};
        const key = `${levelId}|${subjectId}|${chapterId}`;
        setNewNotions(p=>({...p,[key]:[...(p[key]||[]),n]}));
        // Rester sur le chapitre courant après création
        setSelected({type:"chapter", levelId, subjectId, chapterId});
        showToast(`Notion «${label}» créée`); setModal(null);
      };

      const createNotionWithAI = (levelId, subjectId, chapterId, label, aiCfg) => {
        const id = slugify(label)||genId();
        const notion = {id,label,icon:"📌",_new:true,lesson:{formula:"",text:"",example:""},fullBlocks:[],levels:Array(6).fill([])};
        const key = `${levelId}|${subjectId}|${chapterId}`;
        setNewNotions(p=>({...p,[key]:[...(p[key]||[]),notion]}));
        // Passer la config IA pour auto-générer à l'ouverture
        const ch = merged?.[levelId]?.subjects?.[subjectId]?.chapters?.find(c=>c.id===chapterId);
        setEditingNotion({notion,levelId,subjectId,chapterId,chapterLabel:ch?.label||chapterId,
          initCfg:{...aiCfg,_autoGen:true}});
        setSelected({type:"notion",levelId,subjectId,chapterId,notionId:id});
        showToast(`Notion «${label}» créée — génération IA lancée…`);
        setModal(null);
      };

      // ── Rename ────────────────────────────────────────
      const renameChapter = (levelId,subjectId,chapterId,newLabel) => {
        const key = `${levelId}|${subjectId}`;
        setNewChapters(p=>({...p,[key]:(p[key]||[]).map(c=>c.id===chapterId?{...c,label:newLabel}:c)}));
        showToast("Chapitre renommé"); setModal(null);
      };
      const renameNotion = (levelId,subjectId,chapterId,notionId,newLabel) => {
        const key = `${levelId}|${subjectId}|${chapterId}`;
        // Récupérer ancien label pour supprimer l'ancien fichier
        const oldNotion = (newNotions[key]||[]).find(n=>n.id===notionId)
          || merged?.[levelId]?.subjects?.[subjectId]?.chapters?.find(c=>c.id===chapterId)
             ?.notions?.find(n=>n.id===notionId);
        if (oldNotion && folderHandle) fsDeleteNotion(levelId, subjectId, chapterId, notionId, oldNotion.label);
        setNewNotions(p=>({...p,[key]:(p[key]||[]).map(n=>n.id===notionId?{...n,label:newLabel}:n)}));
        const eKey = `${levelId}|${subjectId}|${chapterId}|${notionId}`;
        setLocalEdits(p=>p[eKey]?{...p,[eKey]:{...p[eKey],label:newLabel}}:p);
        showToast("Notion renommée"); setModal(null);
      };

      // ── Delete ────────────────────────────────────────
      const deleteChapter = (levelId,subjectId,chapterId) => {
        const key = `${levelId}|${subjectId}`;
        setNewChapters(p=>({...p,[key]:(p[key]||[]).filter(c=>c.id!==chapterId)}));
        if (editingNotion?.chapterId===chapterId) setEditingNotion(null);
        showToast("Chapitre supprimé"); setModal(null);
      };
      const deleteNotion = (levelId,subjectId,chapterId,notionId) => {
        // Récupérer le label avant suppression pour savoir le nom du fichier
        const key = `${levelId}|${subjectId}|${chapterId}`;
        const notion = (newNotions[key]||[]).find(n=>n.id===notionId)
          || merged?.[levelId]?.subjects?.[subjectId]?.chapters?.find(c=>c.id===chapterId)
             ?.notions?.find(n=>n.id===notionId);
        setNewNotions(p=>({...p,[key]:(p[key]||[]).filter(n=>n.id!==notionId)}));
        setLocalEdits(p=>{ const c={...p}; delete c[`${levelId}|${subjectId}|${chapterId}|${notionId}`]; return c; });
        if (editingNotion?.notion?.id===notionId) setEditingNotion(null);
        if (notion) fsDeleteNotion(levelId, subjectId, chapterId, notionId, notion.label);
        showToast("Notion supprimée"); setModal(null);
      };

      // ── Sauvegarder notion éditée ─────────────────────
      const saveNotionEdit = (levelId,subjectId,chapterId,notion) => {
        const key = `${levelId}|${subjectId}|${chapterId}|${notion.id}`;
        setLocalEdits(p=>({...p,[key]:notion}));
        showToast(`«${notion.label}» sauvegardé`);
      };

      // ── Ouvrir éditeur d'une notion ───────────────────
      // BUG FIX : on stocke les métadonnées séparément pour ne pas dépendre de `selected`
      const openEdit = (notion, levelId, subjectId, chapterId) => {
        const ch = merged?.[levelId]?.subjects?.[subjectId]?.chapters?.find(c=>c.id===chapterId);
        setEditingNotion({ notion:{...notion}, levelId, subjectId, chapterId,
          chapterLabel: ch?.label||chapterId });
        setSelected({type:"notion",levelId,subjectId,chapterId,notionId:notion.id});
      };

      // ── Download chapitre ─────────────────────────────
      const dlChapter = (levelId,subjectId,chapterId) => {
        const ch = merged?.[levelId]?.subjects[subjectId]?.chapters.find(c=>c.id===chapterId);
        if (!ch) return;
        dl(exportChapterJS(ch,subjectId,levelId), `${chapterId}.js`);
        showToast(`${chapterId}.js téléchargé`);
      };

      // ── Sélectionner chapitre ─────────────────────────
      const selectChapter = sel => {
        setSelected(sel);
        setEditingNotion(null); // ferme l'éditeur
      };

      // ── Chargement ────────────────────────────────────
      // Note: merged est toujours un objet (jamais null), l'app est toujours opérationnelle
      const isFromParent = Object.keys(structure).length > 0;
      const isEmpty = Object.keys(merged).length === 0;

      // ── Rendu principal ───────────────────────────────
      return (
        <div className="g-app">
          {/* Topbar */}
          <div className="g-topbar">
            <div className="g-topbar__logo">∫</div>
            <div>
              <div className="g-topbar__title">Gestionnaire de Projet</div>
            </div>
            <div className="g-topbar__stats">
              {[
                {dot:"var(--g-primary-light)",val:stats.chapters,lbl:"chapitres"},
                {dot:"#A78BFA",val:stats.notions,lbl:"notions"},
                {dot:"var(--g-success)",val:stats.blocks,lbl:"blocs"},
              ].map(s=>(
                <div key={s.lbl} className="g-topbar__stat">
                  <div className="g-topbar__stat-dot" style={{background:s.dot}}/>
                  <span style={{fontWeight:700,color:"var(--g-text)"}}>{s.val}</span>
                  <span style={{color:"var(--g-muted)"}}>{s.lbl}</span>
                </div>
              ))}
            </div>
            <div className="g-topbar__actions">
              <button className="g-btn g-btn-ghost g-btn-sm"
                onClick={()=>{
                  const out = JSON.stringify(Object.fromEntries(Object.entries(localEdits)),null,2);
                  dl(`// Éditions locales\n// ${new Date().toLocaleDateString("fr-FR")}\nexport const edits = ${out};\n`,"edits-gestionnaire.js");
                  showToast("Éditions exportées");
                }}>📦 Exporter éditions</button>
              <button
                className="g-btn g-btn-ghost g-btn-sm"
                onClick={requestFolderAccess}
                style={folderHandle ? {borderColor:"rgba(16,185,129,.4)",color:"#34D399"} : {}}>
                {folderHandle
                  ? (fsStatus==="saving" ? "⏳ Écriture…" : fsStatus==="error" ? "❌ Erreur sync" : "✅ "+folderName)
                  : "📂 Connecter dossier"}
              </button>
            </div>
          </div>

          {/* Bannière dossier de travail */}
          {!folderHandle ? (
            <div className="g-folder-banner">
              <span className="g-folder-banner__icon">📁</span>
              <span style={{color:"var(--g-text-2)",flex:1}}>
                Aucun dossier connecté — clique pour autoriser l'accès et synchroniser les fichiers locaux
              </span>
              <button className="g-folder-banner__btn" onClick={requestFolderAccess}>
                📂 Choisir le dossier de travail
              </button>
            </div>
          ) : (
            <div className="g-folder-banner">
              <span className="g-folder-banner__icon">📂</span>
              <span className="g-folder-banner__path">…/{folderName}</span>
              <span className={`g-folder-banner__status${fsStatus==="saving"?" saving":fsStatus==="error"?" error":""}`}>
                {fsStatus==="saving" ? "⏳ Écriture…" : fsStatus==="error" ? "❌ Erreur" : fsStatus==="saved" ? "✅ Synchronisé" : "🟢 Connecté"}
              </span>
              <button className="g-folder-banner__btn" onClick={requestFolderAccess} style={{marginLeft:8}}>
                ↺ Changer
              </button>
            </div>
          )}

          <div className="g-body">
            {/* Sidebar */}
            <SidebarTree
              merged={merged}
              selected={selected}
              onSelect={selectChapter}
              onEdit={openEdit}
              ctxMenu={ctxMenu}
              panelWidth={panelWidth}
              setModal={setModal}
              localEdits={localEdits}
              newNotions={newNotions}
              onCreateLevel={()=>setModal({type:"create-level"})}
              onCreateSubject={(lid,lLabel)=>setModal({type:"create-subject",levelId:lid,levelLabel:lLabel})}
              onCreateChapter={(lid,sid)=>setModal({type:"create-chapter",levelId:lid,subjectId:sid})}
              onCreateNotion={(lid,sid,cid,clabel)=>setModal({type:"create-notion",levelId:lid,subjectId:sid,chapterId:cid,chapterLabel:clabel})}
            />

            {/* Splitter */}
            <div className={`g-splitter ${splDrag?"dragging":""}`}
              onMouseDown={e=>{
                setSplDrag(true);
                const startX=e.clientX, startW=panelWidth;
                const onMove=ev=>setPanelWidth(Math.max(180,Math.min(520,startW+ev.clientX-startX)));
                const onUp=()=>{setSplDrag(false);window.removeEventListener("mousemove",onMove);window.removeEventListener("mouseup",onUp);};
                window.addEventListener("mousemove",onMove);
                window.addEventListener("mouseup",onUp);
              }}/>

            {/* Panneau principal */}
            <div className="g-main">
              {editingNotion ? (
                <NotionEditor
                  key={editingNotion.notion.id+"|"+editingNotion.chapterId}
                  notion={editingNotion.notion}
                  chapterId={editingNotion.chapterId}
                  chapterLabel={editingNotion.chapterLabel||(merged?.[editingNotion.levelId]?.subjects?.[editingNotion.subjectId]?.chapters?.find(c=>c.id===editingNotion.chapterId)?.label||editingNotion.chapterId)}
                  initCfg={editingNotion.initCfg||null}
                  onSave={n=>saveNotionEdit(editingNotion.levelId,editingNotion.subjectId,editingNotion.chapterId,n)}
                  onClose={()=>{
                    setEditingNotion(null);
                    if (selected?.chapterId) setSelected({...selected,type:"chapter",notionId:undefined});
                  }}
                />
              ) : selected?.type==="chapter" ? (
                <ChapterView
                  merged={merged}
                  levelId={selected.levelId}
                  subjectId={selected.subjectId}
                  chapterId={selected.chapterId}
                  onCreateNotion={()=>setModal({type:"create-notion",levelId:selected.levelId,subjectId:selected.subjectId,chapterId:selected.chapterId,chapterLabel:merged?.[selected.levelId]?.subjects[selected.subjectId]?.chapters.find(c=>c.id===selected.chapterId)?.label||""})}
                  onEditNotion={n=>openEdit(n,selected.levelId,selected.subjectId,selected.chapterId)}
                  onNotionCtx={(e,notionId,isNew)=>{
                    const ch = merged?.[selected.levelId]?.subjects[selected.subjectId]?.chapters.find(c=>c.id===selected.chapterId);
                    const notion = [...(ch?.notions||[]),...(ch?.l1Notions||[])].find(n=>n.id===notionId);
                    if (!notion) return;
                    ctxMenu.open(e,[
                      {icon:"✏️",label:"Éditer",action:()=>openEdit(notion,selected.levelId,selected.subjectId,selected.chapterId)},
                      ...(isNew?[{icon:"📝",label:"Renommer",action:()=>setModal({type:"rename-notion",levelId:selected.levelId,subjectId:selected.subjectId,chapterId:selected.chapterId,notionId,current:notion.label})}]:[]),
                      "sep",
                      {icon:"💾",label:"Exporter .js",action:()=>{ dl(exportNotionJS(notion,selected.chapterId),notionId+".js"); showToast(notionId+".js téléchargé"); }},
                      ...(isNew?["sep",{icon:"🗑️",label:"Supprimer",danger:true,action:()=>setModal({type:"delete-notion",levelId:selected.levelId,subjectId:selected.subjectId,chapterId:selected.chapterId,notionId,label:notion.label})}]:[]),
                    ]);
                  }}
                  onDownload={()=>dlChapter(selected.levelId,selected.subjectId,selected.chapterId)}
                />
              ) : isEmpty ? (
                <div className="g-welcome">
                  <div className="g-welcome-logo">∫</div>
                  <div className="g-welcome-title">Gestionnaire de Projet MathoDuo</div>
                  <div className="g-welcome-sub" style={{marginBottom:24}}>
                    {isFromParent
                      ? "Données reçues depuis MathoDuo — crée un premier niveau scolaire pour commencer à structurer ton contenu."
                      : "Aucune donnée chargée. Démarre en créant un niveau scolaire, ou recharge les données depuis l'application MathoDuo."}
                  </div>

                  <div style={{display:"flex",gap:10,flexWrap:"wrap",justifyContent:"center",marginBottom:32}}>
                    <button className="g-btn g-btn-primary g-btn-sm" onClick={()=>setModal({type:"create-level"})}>
                      ➕ Créer un niveau scolaire
                    </button>
                    <button className="g-btn g-btn-ghost g-btn-sm"
                      onClick={()=>window.parent.postMessage({type:"REQUEST_SUBJECTS"},"*")}>
                      ↻ Recharger depuis MathoDuo
                    </button>
                  </div>

                  {/* ── Sync locale ── */}
                  <div className="g-tips" style={{marginBottom:20}}>
                    <div style={{fontSize:10,fontWeight:900,color:"#FBBF24",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:8}}>
                      📂 Synchronisation avec ton dossier local
                    </div>
                    <div className="g-tip" style={{flexDirection:"column",gap:10,alignItems:"stretch",borderColor:"rgba(251,191,36,.25)",background:"rgba(251,191,36,.04)"}}>
                      <div style={{fontSize:12,fontWeight:700,color:"#FCD34D",marginBottom:2}}>
                        Avant de créer du contenu — connecte ton dossier de travail
                      </div>
                      <div style={{fontSize:11,color:"var(--g-text-2)",lineHeight:1.8}}>
                        La bannière juste en dessous de la barre de titre affiche <strong style={{color:"var(--g-text)"}}>«&nbsp;📂 Choisir le dossier de travail&nbsp;»</strong>.
                        Clique dessus et sélectionne la racine de ton projet (ex&nbsp;: <code style={{fontFamily:"JetBrains Mono",fontSize:10,color:"#A78BFA"}}>~/Documents/mathoduo/</code>).
                        Le navigateur te demandera l'autorisation de modifier les fichiers de ce dossier — accepte-la.
                      </div>
                      <div style={{fontSize:11,color:"var(--g-text-2)",lineHeight:1.8}}>
                        Une fois connecté, <strong style={{color:"var(--g-text)"}}>chaque action est immédiatement répercutée sur le disque</strong> :
                        créer un chapitre génère son dossier avec un <code style={{fontFamily:"JetBrains Mono",fontSize:10,color:"#A78BFA"}}>index.js</code>,
                        ajouter ou éditer une notion réécrit ce même <code style={{fontFamily:"JetBrains Mono",fontSize:10,color:"#A78BFA"}}>index.js</code> avec toutes les notions du chapitre à jour.
                        Toutes les notions sont concentrées dans un seul fichier par chapitre — tu n'as rien à exporter manuellement.
                      </div>
                      <div style={{fontSize:11,color:"var(--g-muted)",borderTop:"1px solid var(--g-border)",paddingTop:8,marginTop:2}}>
                        ⚠️ Fonctionne uniquement dans <strong style={{color:"var(--g-text-2)"}}>Chrome ou Edge</strong> (API File System Access, version 86+).
                        Si le bouton n'apparaît pas dans la bannière, ouvre ce fichier dans Chrome.
                      </div>
                    </div>
                  </div>

                  {/* ── Architecture ── */}
                  <div className="g-tips" style={{marginBottom:20}}>
                    <div style={{fontSize:10,fontWeight:900,color:"var(--g-primary-light)",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:8}}>
                      🗂 Architecture des fichiers sur le disque
                    </div>
                    <div className="g-tip" style={{flexDirection:"column",gap:0,padding:0,overflow:"hidden",alignItems:"stretch"}}>
                      <div style={{padding:"10px 16px",fontSize:11,color:"var(--g-text-2)",lineHeight:1.7,borderBottom:"1px solid var(--g-border)"}}>
                        La hiérarchie Niveau → Matière → Chapitre → Notion est reproduite exactement sous forme de dossiers imbriqués.
                        Chaque notion devient un fichier <code style={{fontFamily:"JetBrains Mono",fontSize:10,color:"#A78BFA"}}>.js</code> autonome,
                        importable directement dans l'application MathoDuo.
                      </div>
                      <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"var(--g-text-2)",lineHeight:2.2,padding:"12px 16px",background:"var(--g-surface-2)"}}>
                        <span style={{color:"#FBBF24"}}>dossier-choisi/</span><br/>
                        <span style={{paddingLeft:16,color:"var(--g-primary-light)"}}>terminale/</span><br/>
                        <span style={{paddingLeft:32,color:"#A78BFA"}}>mathematiques/</span><br/>
                        <span style={{paddingLeft:48,color:"var(--g-success)"}}>integrales/</span><br/>
                        <span style={{paddingLeft:64,color:"var(--g-xp)"}}>index.js</span>
                        <span style={{fontSize:9,color:"var(--g-muted)",marginLeft:8}}>← toutes les notions du chapitre</span>
                      </div>
                    </div>
                  </div>

                  {/* ── Workflow ── */}
                  <div className="g-tips">
                    <div style={{fontSize:10,fontWeight:900,color:"var(--g-primary-light)",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:8}}>
                      🔁 Workflow recommandé
                    </div>
                    {[
                      {icon:"1️⃣", t:"Connecte ton dossier de travail", d:"Clique sur «📂 Choisir le dossier de travail» dans la bannière. Sélectionne ou crée un dossier vide dédié au projet (ex : mathoduo-content/). Accepte la permission de modification."},
                      {icon:"2️⃣", t:"Crée la structure Niveau → Matière → Chapitre", d:"Utilise les boutons ➕ dans la sidebar. Chaque chapitre crée automatiquement son dossier et son index.js sur le disque."},
                      {icon:"3️⃣", t:"Ajoute des notions et édite leur contenu", d:"Crée une notion via ➕ ou clic droit, puis clique dessus pour ouvrir l'éditeur. Renseigne la leçon, génère les blocs avec l'IA, puis clique «💾 Sauvegarder». Le fichier .js est écrit immédiatement."},
                      {icon:"4️⃣", t:"Importe les fichiers dans MathoDuo", d:"Les fichiers .js générés sont directement compatibles avec l'application. Copie le dossier dans ton projet ou utilise «📦 Exporter éditions» pour une archive JSON de tes modifications."},
                    ].map((tip,i)=>(
                      <div key={i} className="g-tip">
                        <span className="g-tip__icon">{tip.icon}</span>
                        <div>
                          <div className="g-tip__title">{tip.t}</div>
                          <div className="g-tip__desc">{tip.d}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                <WelcomePanel stats={stats}/>
              )}
            </div>
          </div>

          {/* Modals */}
          {modal?.type==="create-level"   && <ModalCreateLevel onConfirm={createLevel} onClose={()=>setModal(null)}/>}
          {modal?.type==="create-subject" && <ModalCreateSubject levelId={modal.levelId} levelLabel={modal.levelLabel} onConfirm={d=>createSubject(modal.levelId,d)} onClose={()=>setModal(null)}/>}
          {modal?.type==="create-chapter" && <ModalCreateChapter onConfirm={d=>createChapter(modal.levelId,modal.subjectId,d)} onClose={()=>setModal(null)}/>}
          {modal?.type==="create-notion" && <ModalCreateNotion
            chapterLabel={modal.chapterLabel||""}
            onConfirm={label=>createNotion(modal.levelId,modal.subjectId,modal.chapterId,label)}
            onConfirmWithAI={(label,cfg)=>createNotionWithAI(modal.levelId,modal.subjectId,modal.chapterId,label,cfg)}
            onClose={()=>setModal(null)}
          />}
          {modal?.type==="rename-chapter" && <ModalRename title="✏️ Renommer le chapitre" current={modal.current} onConfirm={v=>renameChapter(modal.levelId,modal.subjectId,modal.chapterId,v)} onClose={()=>setModal(null)}/>}
          {modal?.type==="rename-notion"  && <ModalRename title="✏️ Renommer la notion"   current={modal.current} onConfirm={v=>renameNotion(modal.levelId,modal.subjectId,modal.chapterId,modal.notionId,v)} onClose={()=>setModal(null)}/>}
          {modal?.type==="delete-chapter" && <ModalConfirm title="Supprimer le chapitre" msg={`Supprimer «${modal.label}» et toutes ses notions ? Cette action est irréversible.`} onConfirm={()=>deleteChapter(modal.levelId,modal.subjectId,modal.chapterId)} onClose={()=>setModal(null)}/>}
          {modal?.type==="delete-notion"  && <ModalConfirm title="Supprimer la notion"   msg={`Supprimer «${modal.label}» ? Cette action est irréversible.`}                        onConfirm={()=>deleteNotion(modal.levelId,modal.subjectId,modal.chapterId,modal.notionId)} onClose={()=>setModal(null)}/>}

          <CtxMenu menu={ctxMenu.menu} close={ctxMenu.close}/>
          {toast && <div className="g-toast">✓ {toast}</div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
