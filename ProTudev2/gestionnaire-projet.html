    // ══════════════════════════════════════════════════
    // NOTION EDITOR
    // ══════════════════════════════════════════════════
    function NotionEditor({notion,chapterId,chapterLabel,onSave,onClose}) {
      const [n,setN]=useState(()=>({
        ...notion,
        lesson: notion.lesson||{formula:"",text:"",example:""},
        fullBlocks: (notion.fullBlocks||[]).map((b,i)=>({...b,_id:b._id||(genId()+i)})),
        levels: notion.levels||Array(6).fill([]),
      }));
      const [saved,setSaved]=useState(false);
      const [tab,setTab]=useState("lesson");

      const setLesson=(field,val)=>setN(p=>({...p,lesson:{...p.lesson,[field]:val}}));
      const updBlocks=blocks=>setN(p=>({...p,fullBlocks:blocks}));
      const addBlock=type=>{
        const bt=BT[type];
        const nb={_id:genId(),type,title:`${bt.icon} ${bt.label}`,text:"",formula:""};
        setN(p=>({...p,fullBlocks:[...p.fullBlocks,nb]}));
      };
      const handleSave=()=>{onSave(n);setSaved(true);setTimeout(()=>setSaved(false),2000);};
      const handleDl=()=>dl(exportNotionJS(n,chapterId),`${n.id}.js`);
      const totalQ=n.levels.reduce((s,l)=>s+(Array.isArray(l)?l.length:0),0);

      return (
        <div className="g-editor">
          <div className="g-editor-topbar">
            <div style={{flex:1,minWidth:0}}>
              <div className="g-editor-name">
                {notion._isL1&&<span className="g-badge-l1">L1</span>}
                {notion._readonly&&<span style={{fontSize:".58rem",background:"var(--success-faint)",color:"var(--success)",border:"1px solid #6EE7B7",borderRadius:4,padding:"1px 6px"}}>📦 Chargé</span>}
                <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{n.label}</span>
              </div>
              <div className="g-editor-meta">id: {n.id} · {n.fullBlocks.length} blocs · {totalQ} questions</div>
            </div>
            <div style={{display:"flex",gap:6,flexShrink:0,flexWrap:"wrap"}}>
              <button className="g-btn g-btn-ghost g-btn-sm" onClick={handleDl}>💾 .js</button>
              <button className={`g-btn g-btn-sm ${saved?"g-btn-success":"g-btn-primary"}`}
                onClick={handleSave}>{saved?"✅ Sauvé":"💾 Sauvegarder"}</button>
              <button className="g-btn g-btn-ghost g-btn-sm"
                onClick={onClose} style={{color:"var(--danger)",borderColor:"#FCA5A5"}}>✕</button>
            </div>
          </div>

          <div className="g-editor-tabs">
            {[{id:"lesson",label:"📚 Leçon"},{id:"blocks",label:"🧱 Blocs"},{id:"levels",label:"🎯 Niveaux"},{id:"code",label:"💻 Code"}]
              .map(t=>(
                <button key={t.id} className={`g-editor-tab ${tab===t.id?"active":""}`}
                  onClick={()=>setTab(t.id)}>{t.label}</button>
              ))}
          </div>

          <div className="g-editor-body">

            {tab==="lesson"&&(
              <div style={{display:"flex",flexDirection:"column",gap:14}}>
                <div className="g-field-group">
                  <div className="g-field-label">Formule / Résumé clé</div>
                  <input className="g-field" value={n.lesson.formula}
                    placeholder="ex : F'(x) = f(x) sur I ⟺ F est une primitive de f"
                    onChange={e=>setLesson("formula",e.target.value)}/>
                </div>
                <div className="g-field-group">
                  <div className="g-field-label">Texte de la leçon (3-4 phrases)</div>
                  <textarea className="g-field" value={n.lesson.text} rows={6}
                    placeholder="Définition + mécanisme/propriétés + importance dans le chapitre…"
                    onChange={e=>setLesson("text",e.target.value)}/>
                </div>
                <div className="g-field-group">
                  <div className="g-field-label">Exemple illustratif</div>
                  <textarea className="g-field" value={n.lesson.example} rows={3}
                    placeholder="Un exemple concret avec résultat…"
                    onChange={e=>setLesson("example",e.target.value)}/>
                </div>
              </div>
            )}

            {tab==="blocks"&&(
              <div>
                <div className="g-block-adder">
                  <div className="g-block-adder-title">Ajouter un bloc</div>
                  <div className="g-block-chips">
                    {BLOCK_TYPES.map(bt=>(
                      <button key={bt.type} className="g-block-chip-btn"
                        style={{borderColor:bt.color+"55",color:bt.color,background:bt.color+"12"}}
                        onClick={()=>addBlock(bt.type)}>
                        {bt.icon} {bt.label}
                      </button>
                    ))}
                  </div>
                </div>
                {n.fullBlocks.length===0&&(
                  <div className="g-empty">
                    <div className="g-empty__icon">🧱</div>
                    <div className="g-empty__text">Aucun bloc — ajoute des blocs ci-dessus</div>
                  </div>
                )}
                {n.fullBlocks.map((block,idx)=>(
                  <BlockEditor key={block._id||idx} block={block} idx={idx} total={n.fullBlocks.length}
                    onChange={b=>{const bl=[...n.fullBlocks];bl[idx]=b;updBlocks(bl);}}
                    onDelete={()=>updBlocks(n.fullBlocks.filter((_,i)=>i!==idx))}
                    onUp={()=>{if(idx<=0)return;const bl=[...n.fullBlocks];[bl[idx-1],bl[idx]]=[bl[idx],bl[idx-1]];updBlocks(bl);}}
                    onDown={()=>{if(idx>=n.fullBlocks.length-1)return;const bl=[...n.fullBlocks];[bl[idx],bl[idx+1]]=[bl[idx+1],bl[idx]];updBlocks(bl);}}
                  />
                ))}
              </div>
            )}

            {tab==="levels"&&(
              <div>
                <p style={{fontSize:".72rem",color:"var(--muted)",marginBottom:14,lineHeight:1.65}}>
                  Aperçu des 6 niveaux de questions. Les exercices se gèrent directement dans les fichiers JS.
                </p>
                {n.levels.map((lvl,li)=>(
                  <div key={li} className="g-level-row" style={{flexDirection:"column",alignItems:"stretch",gap:0,padding:0,overflow:"hidden",marginBottom:8}}>
                    <div style={{display:"flex",alignItems:"center",gap:7,padding:"6px 12px",background:"var(--surface-2)"}}>
                      <span style={{fontSize:".68rem",fontWeight:900,color:"var(--primary)",background:"var(--primary-faint)",borderRadius:4,padding:"2px 7px"}}>N{li+1}</span>
                      <span style={{fontSize:".72rem",color:"var(--muted)"}}>{Array.isArray(lvl)?lvl.length:0} questions</span>
                      <span style={{fontSize:".62rem",marginLeft:"auto",color:li<3?"var(--warning)":"var(--primary-light)",fontWeight:700}}>{li<3?"Fondamental":"Avancé"}</span>
                    </div>
                    {Array.isArray(lvl)&&lvl.slice(0,2).map((q,qi)=>(
                      <div key={qi} className="g-level-q">
                        <span className="g-level-q__type">[{q.type}]</span>
                        {(q.question||"").slice(0,90)}{(q.question||"").length>90?"…":""}
                      </div>
                    ))}
                    {Array.isArray(lvl)&&lvl.length>2&&(
                      <div style={{padding:"3px 12px",fontSize:".68rem",color:"var(--light)"}}>+{lvl.length-2} autres…</div>
                    )}
                  </div>
                ))}
              </div>
            )}

            {tab==="code"&&(
              <div>
                <div style={{display:"flex",gap:7,marginBottom:10}}>
                  <button className="g-btn g-btn-ghost g-btn-sm"
                    onClick={()=>navigator.clipboard.writeText(exportNotionJS(n,chapterId))}>
                    📋 Copier le code
                  </button>
                  <button className="g-btn g-btn-ghost g-btn-sm" onClick={handleDl}>
                    💾 Télécharger .js
                  </button>
                </div>
                <pre className="g-code-block"><code>{exportNotionJS(n,chapterId)}</code></pre>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // NOTION CARD
    // ══════════════════════════════════════════════════
    function NotionCard({notion,index,onEdit,onCtx}) {
      const blocks=notion.fullBlocks||[];
      const byType=blocks.reduce((a,b)=>{a[b.type]=(a[b.type]||0)+1;return a;},{});
      const totalQ=notion.levels.reduce((s,l)=>s+(Array.isArray(l)?l.length:0),0);
      const isComplete=notion.lesson?.text&&blocks.length>0;
      const statusColor=notion._isL1?"var(--pink)":isComplete?"var(--success)":blocks.length>0?"var(--warning)":"var(--light)";
      return (
        <div className={`g-notion-card ${notion._isL1?"l1":""}`} onContextMenu={onCtx} onClick={onEdit}>
          <div className="g-notion-card__header">
            <div className="g-notion-card__num">{index+1}</div>
            <div className="g-notion-card__name">
              {notion.label}
              {notion._isL1&&<span className="g-badge-l1" style={{marginLeft:5}}>L1</span>}
              {notion._new&&<span className="g-badge-new" style={{marginLeft:5}}>NEW</span>}
            </div>
            <div className="g-notion-card__status" style={{background:statusColor}}/>
          </div>
          {notion.lesson?.text&&(
            <div className="g-notion-card__text">{notion.lesson.text}</div>
          )}
          <div className="g-notion-card__blocks">
            {blocks.length===0
              ?<span style={{fontSize:".65rem",color:"var(--light)"}}>Aucun bloc</span>
              :Object.entries(byType).map(([type,count])=>{
                const bt=BT[type];
                return bt?<span key={type} className="g-notion-card__block-chip"
                  style={{background:`${bt.color}18`,border:`1px solid ${bt.color}35`,color:bt.color}}>
                  {bt.icon} {count}</span>:null;
              })
            }
            {totalQ>0&&<span className="g-notion-card__qcount">{totalQ}q</span>}
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // CHAPTER VIEW
    // ══════════════════════════════════════════════════
    function ChapterView({merged,levelId,subjectId,chapterId,onCreateNotion,onEditNotion,onNotionCtx,onDownload}) {
      const ch=merged?.[levelId]?.subjects[subjectId]?.chapters.find(c=>c.id===chapterId);
      if(!ch) return null;
      const allN=[...(ch.notions||[]),...(ch.l1Notions||[])];
      const complete=allN.filter(n=>n.fullBlocks?.length>0&&n.lesson?.text).length;
      const blocks=allN.reduce((s,n)=>s+(n.fullBlocks||[]).length,0);
      const qs=allN.reduce((s,n)=>s+n.levels.reduce((a,l)=>a+(Array.isArray(l)?l.length:0),0),0);
      const pct=allN.length>0?Math.round(complete/allN.length*100):0;
      return (
        <div className="g-chapter-view">
          <div className="g-chapter-header">
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div className="g-chapter-icon">{ch.icon||"📚"}</div>
              <div>
                <div className="g-chapter-title">{ch.label}</div>
                {ch.description&&<div className="g-chapter-desc">{ch.description}</div>}
                <div className="g-chapter-meta">
                  <span style={{color:"var(--primary)"}}>{allN.length} notions</span>
                  <span style={{color:"var(--success)"}}>{complete} complètes</span>
                  <span style={{color:"var(--warning)"}}>{blocks} blocs</span>
                  <span style={{color:"var(--muted)"}}>{qs} questions</span>
                </div>
              </div>
            </div>
            <div style={{display:"flex",gap:7}}>
              <button className="g-btn g-btn-ghost g-btn-sm" onClick={onDownload}>💾 Exporter .js</button>
              <button className="g-btn g-btn-primary g-btn-sm" onClick={onCreateNotion}>➕ Nouvelle notion</button>
            </div>
          </div>
          <div style={{marginBottom:4,display:"flex",justifyContent:"space-between",fontSize:".72rem",color:"var(--muted)"}}>
            <span>Progression</span><span style={{fontWeight:700,color:"var(--primary)"}}>{pct}%</span>
          </div>
          <div className="g-progress-bar" style={{marginBottom:22}}>
            <div className="g-progress-fill" style={{width:`${pct}%`}}/>
          </div>
          {allN.length===0?(
            <div className="g-empty">
              <div className="g-empty__icon">🌱</div>
              <div className="g-empty__text">Aucune notion dans ce chapitre</div>
              <button className="g-btn g-btn-primary g-btn-sm" onClick={onCreateNotion}>➕ Créer une notion</button>
            </div>
          ):(
            <div className="g-notions-grid">
              {allN.map((n,i)=>(
                <NotionCard key={n.id} notion={n} index={i}
                  onEdit={()=>onEditNotion(n)}
                  onCtx={e=>onNotionCtx(e,n.id,!!n._new)}/>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // SIDEBAR TREE
    // ══════════════════════════════════════════════════
    function SidebarTree({merged,selected,onSelect,onEdit,ctxMenu,panelWidth,setModal,localEdits,newNotions,onCreateLevel,onCreateSubject,onCreateChapter,onCreateNotion}) {
      return (
        <div className="g-sidebar" style={{width:panelWidth}}>
          {Object.values(merged).map(lvl=>(
            <div key={lvl.id} className="g-tree-level">
              <div className="g-tree-level-header">
                <span>{lvl.label}</span>
                <button title="Ajouter une matière" onClick={()=>onCreateSubject(lvl.id,lvl.label)}>＋</button>
              </div>
              {Object.values(lvl.subjects||{}).map(subj=>(
                <div key={subj.id}>
                  <div className="g-tree-subject-header">
                    <span>{subj.icon}</span>
                    <span style={{flex:1}}>{subj.label}</span>
                    <button className="g-add-btn" title="Ajouter un chapitre"
                      onClick={()=>onCreateChapter(lvl.id,subj.id)}>＋</button>
                  </div>
                  {(subj.chapters||[]).map(ch=>{
                    const allN=[...(ch.notions||[]),...(ch.l1Notions||[])];
                    const isSelCh=selected?.type==="chapter"&&selected.chapterId===ch.id;
                    return (
                      <div key={ch.id}>
                        <div className={`g-tree-chapter ${isSelCh?"active":""}`}
                          onClick={()=>onSelect({type:"chapter",levelId:lvl.id,subjectId:subj.id,chapterId:ch.id})}
                          onContextMenu={e=>ctxMenu.open(e,[
                            {icon:"✏️",label:"Renommer",action:()=>setModal({type:"rename-chapter",levelId:lvl.id,subjectId:subj.id,chapterId:ch.id,current:ch.label})},
                            {icon:"💾",label:"Exporter .js",action:()=>{/* handled in parent */}},
                            "sep",
                            {icon:"🗑️",label:"Supprimer",danger:true,action:()=>setModal({type:"delete-chapter",levelId:lvl.id,subjectId:subj.id,chapterId:ch.id,label:ch.label})},
                          ])}>
                          <span className="g-tree-chapter__icon">{ch.icon}</span>
                          <span className="g-tree-chapter__label">{ch.label}</span>
                          <span className="g-tree-chapter__count">{allN.length}</span>
                          <button className="g-tree-chapter__add" title="Ajouter une notion"
                            onClick={e=>{e.stopPropagation();onCreateNotion(lvl.id,subj.id,ch.id,ch.label);}}>＋</button>
                        </div>
                        {isSelCh&&allN.map((n,ni)=>{
                          const isSel=selected?.notionId===n.id;
                          return (
                            <div key={n.id}
                              className={`g-tree-notion ${isSel?"active":""}`}
                              onClick={()=>{onSelect({type:"notion",levelId:lvl.id,subjectId:subj.id,chapterId:ch.id,notionId:n.id});onEdit(n,lvl.id,subj.id,ch.id);}}>
                              <div className="g-tree-notion__dot" style={{background:n._isL1?"var(--pink)":n._new?"var(--success)":"var(--primary-light)"}}/>
                              <span className="g-tree-notion__label">{n.label}</span>
                              {n._isL1&&<span className="g-badge-l1">L1</span>}
                              {n._new&&<span className="g-badge-new">NEW</span>}
                            </div>
                          );
                        })}
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          ))}
          <div style={{padding:"10px 12px",borderTop:"1px solid var(--border)",marginTop:"auto"}}>
            <button className="g-btn g-btn-ghost g-btn-sm" style={{width:"100%"}}
              onClick={onCreateLevel}>➕ Nouveau niveau scolaire</button>
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // WELCOME PANEL
    // ══════════════════════════════════════════════════
    function WelcomePanel({stats}) {
      return (
        <div className="g-welcome">
          <div className="g-welcome-logo">∑</div>
          <div className="g-welcome-title">Gestionnaire de Projet</div>
          <div className="g-welcome-sub">
            {stats.chapters} chapitres · {stats.notions} notions chargés — sélectionne un chapitre pour commencer
          </div>
          <div className="g-stats-row">
            {[
              {label:"Chapitres",val:stats.chapters,icon:"📚",color:"var(--primary)"},
              {label:"Notions",  val:stats.notions,  icon:"🧠",color:"var(--primary-light)"},
              {label:"Blocs",    val:stats.blocks,   icon:"🧱",color:"var(--success)"},
            ].map(s=>(
              <div key={s.label} className="g-stat-card">
                <div className="g-stat-card__icon">{s.icon}</div>
                <div className="g-stat-card__val" style={{color:s.color}}>{s.val}</div>
                <div className="g-stat-card__lbl">{s.label}</div>
              </div>
            ))}
          </div>
          <div className="g-tips">
            {[
              {icon:"📂",t:"Connecte ton dossier",d:"Clique sur «📂 Choisir le dossier» dans la bannière pour synchroniser les fichiers .js en temps réel."},
              {icon:"➕",t:"Crée ta structure",d:"Niveau → Matière → Chapitre → Notion. Chaque notion génère un fichier .js importable dans MathoDuo."},
              {icon:"📈",t:"Utilise le constructeur de graphiques",d:"Dans un bloc Graphe SVG, clique «📈 Constructeur visuel» pour dessiner des courbes, barres, et schémas interactifs."},
              {icon:"💾",t:"Exporte ton travail",d:"Bouton «📦 Exporter» en haut pour créer un ZIP ou écrire directement dans ton dossier."},
            ].map((t,i)=>(
              <div key={i} className="g-tip">
                <span className="g-tip__icon">{t.icon}</span>
                <div><div className="g-tip__title">{t.t}</div><div className="g-tip__desc">{t.d}</div></div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════
    // APP PRINCIPAL
    // ══════════════════════════════════════════════════
    function App() {
      const [structure,   setStructure]   = useState({});
      const [localEdits,  setLocalEdits]  = useState({});
      const [newChapters, setNewChapters] = useState({});
      const [newNotions,  setNewNotions]  = useState({});
      const [newLevels,   setNewLevels]   = useState({});
      const [newSubjects, setNewSubjects] = useState({});
      const [selected,    setSelected]    = useState(null);
      const [editingNotion,setEditingNotion]=useState(null);
      const [modal,       setModal]       = useState(null);
      const [toast,       setToast]       = useState("");
      const [panelWidth,  setPanelWidth]  = useState(260);
      const [splDrag,     setSplDrag]     = useState(false);
      const [exportProg,  setExportProg]  = useState(null);
      const [folderHandle,setFolderHandle]= useState(null);
      const [folderName,  setFolderName]  = useState("");
      const [fsStatus,    setFsStatus]    = useState("idle");
      const fsStatusTimer = React.useRef(null);
      const mergedRef     = React.useRef({});
      const isSyncingRef  = React.useRef(false);
      const folderHandleRef = React.useRef(null);
      const ctxMenu = useCtxMenu();

      const showToast = msg => { setToast(msg); setTimeout(()=>setToast(""),2400); };
      const setFsOk  = () => { setFsStatus("saved");  clearTimeout(fsStatusTimer.current); fsStatusTimer.current=setTimeout(()=>setFsStatus("idle"),2000); };
      const setFsErr = () => { setFsStatus("error");  clearTimeout(fsStatusTimer.current); fsStatusTimer.current=setTimeout(()=>setFsStatus("idle"),4000); };
      const setFsSaving = () => setFsStatus("saving");
      const sl = s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

      const getChapterDir = async (fh,levelId,subjectId,chapterId,labels={}) => {
        const lDir=await fh.getDirectoryHandle(sl(labels.levelLabel||levelId),{create:true});
        const sDir=await lDir.getDirectoryHandle(sl(labels.subjLabel||subjectId),{create:true});
        return await sDir.getDirectoryHandle(sl(labels.chLabel||chapterId),{create:true});
      };
      const fsWriteFile = async (dirHandle,filename,text) => {
        const fh=await dirHandle.getFileHandle(filename,{create:true});
        const w=await fh.createWritable(); await w.write(text); await w.close();
      };

      const fsSaveNotion = async (levelId,subjectId,chapterId,_notion,mergedSnapshot) => {
        const fh=folderHandleRef.current; if(!fh) return;
        try {
          setFsSaving();
          const snap=mergedSnapshot||mergedRef.current;
          const lvl=snap?.[levelId]; const subj=lvl?.subjects?.[subjectId];
          const ch=subj?.chapters?.find(c=>c.id===chapterId);
          if(!ch){setFsOk();return;}
          const labels={levelLabel:lvl?.label,subjLabel:subj?.label,chLabel:ch?.label};
          const cDir=await getChapterDir(fh,levelId,subjectId,chapterId,labels);
          await fsWriteFile(cDir,"index.js",exportChapterJS(ch,subjectId,levelId));
          setFsOk();
        } catch(e){console.error(e);setFsErr();}
      };

      const fsDeleteNotion=fsSaveNotion; // same: réécrit index.js

      const merged = useMemo(()=>{
        const base = subjectsToProject(structure);
        const result = JSON.parse(JSON.stringify(base));
        Object.entries(newLevels).forEach(([lid,lvl])=>{ if(!result[lid]) result[lid]={...lvl,subjects:{}}; });
        Object.entries(newSubjects).forEach(([key,subj])=>{
          const [lid,sid]=key.split("|");
          if(result[lid]&&!result[lid].subjects[sid]) result[lid].subjects[sid]={...subj,chapters:[]};
        });
        Object.entries(newChapters).forEach(([key,ch])=>{
          const [lid,sid]=key.split("|");
          if(result[lid]?.subjects[sid]) result[lid].subjects[sid].chapters.push({...ch,notions:[],l1Notions:[]});
        });
        Object.entries(newNotions).forEach(([key,notion])=>{
          const [lid,sid,cid]=key.split("|");
          const ch=result[lid]?.subjects[sid]?.chapters.find(c=>c.id===cid);
          if(ch&&!ch.notions.find(n=>n.id===notion.id)) ch.notions.push(notion);
        });
        Object.entries(localEdits).forEach(([key,edited])=>{
          const [lid,sid,cid,nid]=key.split("|");
          const ch=result[lid]?.subjects[sid]?.chapters.find(c=>c.id===cid); if(!ch) return;
          const arr=[...(ch.notions||[]),...(ch.l1Notions||[])];
          const tgt=arr.find(n=>n.id===nid); if(tgt) Object.assign(tgt,edited);
        });
        return result;
      },[structure,newLevels,newSubjects,newChapters,newNotions,localEdits]);

      useEffect(()=>{ mergedRef.current=merged; },[merged]);

      const stats = useMemo(()=>{
        let chapters=0,notions=0,blocks=0;
        Object.values(merged).forEach(lvl=>{
          Object.values(lvl.subjects||{}).forEach(subj=>{
            (subj.chapters||[]).forEach(ch=>{
              chapters++;
              const all=[...(ch.notions||[]),...(ch.l1Notions||[])];
              notions+=all.length;
              all.forEach(n=>{blocks+=(n.fullBlocks||[]).length;});
            });
          });
        });
        return {chapters,notions,blocks};
      },[merged]);

      const isEmpty = stats.chapters===0;

      // Recevoir les SUBJECTS depuis le parent (iframe)
      const isFromParent = window!==window.top;
      useEffect(()=>{
        const h=e=>{
          if(e.data?.type==="SUBJECTS_DATA"&&e.data.subjects) setStructure(e.data.subjects);
        };
        window.addEventListener("message",h);
        window.parent?.postMessage({type:"REQUEST_SUBJECTS"},"*");
        return ()=>window.removeEventListener("message",h);
      },[]);

      // File System Access
      const requestFolderAccess = async () => {
        if(!window.showDirectoryPicker){showToast("File System Access non supporté — utilisez Chrome/Edge");return;}
        try {
          const fh=await window.showDirectoryPicker({mode:"readwrite",startIn:"documents"});
          setFolderHandle(fh); folderHandleRef.current=fh; setFolderName(fh.name);
          showToast("📂 Dossier connecté : "+fh.name);
        } catch(e){if(e.name!=="AbortError")showToast("❌ "+e.message);}
      };

      // CRUD
      const createLevel=(data)=>{
        const id=slugify(data.label)||("level_"+genId());
        setNewLevels(p=>({...p,[id]:{id,label:data.label,color:data.color||"#4F46E5",subjects:{}}}));
        showToast("Niveau «"+data.label+"» créé"); setModal(null);
      };
      const createSubject=(lid,data)=>{
        const id=slugify(data.label)||("subj_"+genId());
        const key=lid+"|"+id;
        setNewSubjects(p=>({...p,[key]:{id,label:data.label,icon:data.icon||"📚",chapters:[]}}));
        showToast("Matière «"+data.label+"» créée"); setModal(null);
      };
      const createChapter=(lid,sid,data)=>{
        const id=slugify(data.label)||("ch_"+genId());
        const key=lid+"|"+sid+"|"+id;
        setNewChapters(p=>({...p,[lid+"|"+sid]:{...p[lid+"|"+sid],
          [id]:{id,label:data.label,icon:data.icon||"📚",description:"",xpMax:200,notions:[],l1Notions:[]}
        }}));
        // Plus simple : stocker par ch id
        setNewChapters(p=>{const n={...p};const k=lid+"|"+sid;if(!n[k])n[k]={};n[k][id]={id,label:data.label,icon:data.icon||"📚",description:"",xpMax:200,notions:[],l1Notions:[]};return n;});
        showToast("Chapitre «"+data.label+"» créé"); setModal(null);
      };
      const createNotion=(lid,sid,cid,label)=>{
        const id=slugify(label)||("notion_"+genId());
        const notion={id,label,icon:"📐",_new:true,lesson:{formula:"",text:"",example:""},
          fullBlocks:[],levels:Array(6).fill([])};
        const key=lid+"|"+sid+"|"+cid+"|"+id;
        setNewNotions(p=>({...p,[lid+"|"+sid+"|"+cid+"|"+id]:notion}));
        showToast("Notion «"+label+"» créée"); setModal(null);
        // Ouvrir l'éditeur
        setTimeout(()=>setEditingNotion({notion,levelId:lid,subjectId:sid,chapterId:cid}),80);
      };
      const saveNotionEdit=(lid,sid,cid,n)=>{
        const key=lid+"|"+sid+"|"+cid+"|"+n.id;
        setLocalEdits(p=>({...p,[key]:{...n}}));
        // Synchro FS
        const snap={...mergedRef.current};
        fsSaveNotion(lid,sid,cid,n,snap);
        showToast("Notion «"+n.label+"» sauvegardée");
      };
      const renameChapter=(lid,sid,cid,newLabel)=>{
        setLocalEdits(p=>({...p,[lid+"|"+sid+"|"+cid+"_ch"]:{label:newLabel}}));
        setModal(null); showToast("Renommé : "+newLabel);
      };
      const renameNotion=(lid,sid,cid,nid,newLabel)=>{
        const key=lid+"|"+sid+"|"+cid+"|"+nid;
        setLocalEdits(p=>({...p,[key]:{...(p[key]||{}),label:newLabel}}));
        setModal(null); showToast("Renommé : "+newLabel);
      };
      const deleteNotion=(lid,sid,cid,nid)=>{
        setNewNotions(p=>{const n={...p};delete n[lid+"|"+sid+"|"+cid+"|"+nid];return n;});
        setLocalEdits(p=>{const n={...p};delete n[lid+"|"+sid+"|"+cid+"|"+nid];return n;});
        fsDeleteNotion(lid,sid,cid,nid);
        if(editingNotion?.notion?.id===nid) setEditingNotion(null);
        setModal(null); showToast("Notion supprimée");
      };
      const deleteChapter=(lid,sid,cid)=>{
        setNewChapters(p=>{const n={...p};if(n[lid+"|"+sid])delete n[lid+"|"+sid][cid];return n;});
        setModal(null); showToast("Chapitre supprimé");
      };
      const dlChapter=(lid,sid,cid)=>{
        const ch=merged?.[lid]?.subjects[sid]?.chapters.find(c=>c.id===cid);
        if(ch){dl(exportChapterJS(ch,sid,lid),ch.id+"-index.js");showToast("Exporté : "+ch.id+"-index.js");}
      };
      const openEdit=(notion,lid,sid,cid)=>{
        setEditingNotion({notion,levelId:lid,subjectId:sid,chapterId:cid});
        setSelected(s=>({...s,type:"chapter",notionId:notion.id}));
      };
      const selectChapter=(sel)=>{
        setSelected(sel);
        if(sel.type==="chapter") setEditingNotion(null);
      };

      return (
        <div className="g-app">
          {/* Topbar */}
          <div className="g-topbar">
            <div className="g-topbar__brand">Math<em>Duo</em></div>
            <div className="g-topbar__sep"/>
            <div className="g-topbar__title">Gestionnaire de projet</div>
            <div className="g-topbar__actions">
              <span className="g-topbar__stat">📚 {stats.chapters} chapitres</span>
              <span className="g-topbar__stat">🧠 {stats.notions} notions</span>
              {exportProg ? (
                <span style={{fontSize:".72rem",color:"var(--primary)",fontWeight:600}}>
                  ⏳ {exportProg.done}/{exportProg.total} — {exportProg.last}
                </span>
              ) : (
                <button className="g-btn g-btn-ghost g-btn-sm"
                  onClick={()=>exportFullStructure(merged,
                    (done,total,last)=>setExportProg({done,total,last}),
                    (done)=>{setExportProg(null);showToast(done+" fichiers exportés");},
                    (err)=>{setExportProg(null);showToast("❌ "+err);})}>
                  📦 Exporter
                </button>
              )}
              <button className="g-btn g-btn-primary g-btn-sm"
                onClick={()=>setModal({type:"create-level"})}>
                ➕ Niveau
              </button>
            </div>
          </div>

          {/* Folder banner */}
          {!folderHandle ? (
            window.showDirectoryPicker ? (
              <div style={{display:"flex",alignItems:"center",gap:10,padding:"0 18px",height:32,
                background:"var(--warning-faint)",borderBottom:"1px solid #FCD34D",fontSize:".72rem"}}>
                <span>📂</span>
                <span style={{color:var:"var(--text)"}}>Connecte ton dossier de projet pour synchroniser les fichiers en temps réel</span>
                <button className="g-folder-banner__btn" onClick={requestFolderAccess}>📂 Choisir le dossier</button>
              </div>
            ) : null
          ) : (
            <div className="g-folder-banner">
              <span className="g-folder-banner__icon">📂</span>
              <span className="g-folder-banner__path">…/{folderName}</span>
              <span className={`g-folder-banner__status${fsStatus==="saving"?" saving":fsStatus==="error"?" error":""}`}>
                {fsStatus==="saving"?"⏳ Écriture…":fsStatus==="error"?"❌ Erreur":fsStatus==="saved"?"✅ Synchronisé":"🟢 Connecté"}
              </span>
              <button className="g-folder-banner__btn" onClick={requestFolderAccess}>↺ Changer</button>
            </div>
          )}

          <div className="g-body">
            <SidebarTree
              merged={merged} selected={selected}
              onSelect={selectChapter} onEdit={openEdit}
              ctxMenu={ctxMenu} panelWidth={panelWidth}
              setModal={setModal} localEdits={localEdits} newNotions={newNotions}
              onCreateLevel={()=>setModal({type:"create-level"})}
              onCreateSubject={(lid,lLabel)=>setModal({type:"create-subject",levelId:lid,levelLabel:lLabel})}
              onCreateChapter={(lid,sid)=>setModal({type:"create-chapter",levelId:lid,subjectId:sid})}
              onCreateNotion={(lid,sid,cid,clabel)=>setModal({type:"create-notion",levelId:lid,subjectId:sid,chapterId:cid,chapterLabel:clabel})}
            />

            <div className={`g-splitter ${splDrag?"dragging":""}`}
              onMouseDown={e=>{
                setSplDrag(true);
                const startX=e.clientX,startW=panelWidth;
                const onMove=ev=>setPanelWidth(Math.max(180,Math.min(480,startW+ev.clientX-startX)));
                const onUp=()=>{setSplDrag(false);window.removeEventListener("mousemove",onMove);window.removeEventListener("mouseup",onUp);};
                window.addEventListener("mousemove",onMove);
                window.addEventListener("mouseup",onUp);
              }}/>

            <div className="g-main">
              {editingNotion ? (
                <NotionEditor
                  key={editingNotion.notion.id+"|"+editingNotion.chapterId}
                  notion={editingNotion.notion}
                  chapterId={editingNotion.chapterId}
                  chapterLabel={merged?.[editingNotion.levelId]?.subjects?.[editingNotion.subjectId]?.chapters?.find(c=>c.id===editingNotion.chapterId)?.label||""}
                  onSave={n=>saveNotionEdit(editingNotion.levelId,editingNotion.subjectId,editingNotion.chapterId,n)}
                  onClose={()=>{setEditingNotion(null);if(selected?.chapterId)setSelected({...selected,type:"chapter",notionId:undefined});}}
                />
              ) : selected?.type==="chapter" ? (
                <ChapterView
                  merged={merged}
                  levelId={selected.levelId} subjectId={selected.subjectId} chapterId={selected.chapterId}
                  onCreateNotion={()=>setModal({type:"create-notion",levelId:selected.levelId,subjectId:selected.subjectId,chapterId:selected.chapterId,chapterLabel:merged?.[selected.levelId]?.subjects[selected.subjectId]?.chapters.find(c=>c.id===selected.chapterId)?.label||""})}
                  onEditNotion={n=>openEdit(n,selected.levelId,selected.subjectId,selected.chapterId)}
                  onNotionCtx={(e,notionId,isNew)=>{
                    const ch=merged?.[selected.levelId]?.subjects[selected.subjectId]?.chapters.find(c=>c.id===selected.chapterId);
                    const notion=[...(ch?.notions||[]),...(ch?.l1Notions||[])].find(n=>n.id===notionId);
                    if(!notion) return;
                    ctxMenu.open(e,[
                      {icon:"✏️",label:"Éditer",action:()=>openEdit(notion,selected.levelId,selected.subjectId,selected.chapterId)},
                      ...(isNew?[{icon:"📝",label:"Renommer",action:()=>setModal({type:"rename-notion",levelId:selected.levelId,subjectId:selected.subjectId,chapterId:selected.chapterId,notionId,current:notion.label})}]:[]),
                      "sep",
                      {icon:"💾",label:"Exporter .js",action:()=>{dl(exportNotionJS(notion,selected.chapterId),notionId+".js");showToast(notionId+".js téléchargé");}},
                      ...(isNew?["sep",{icon:"🗑️",label:"Supprimer",danger:true,action:()=>setModal({type:"delete-notion",levelId:selected.levelId,subjectId:selected.subjectId,chapterId:selected.chapterId,notionId,label:notion.label})}]:[]),
                    ]);
                  }}
                  onDownload={()=>dlChapter(selected.levelId,selected.subjectId,selected.chapterId)}
                />
              ) : isEmpty ? (
                <div className="g-welcome">
                  <div className="g-welcome-logo">∑</div>
                  <div className="g-welcome-title">Gestionnaire MathoDuo</div>
                  <div className="g-welcome-sub">
                    {isFromParent?"Données reçues — crée un premier niveau scolaire pour commencer.":"Aucune donnée. Crée un niveau scolaire ou recharge depuis MathoDuo."}
                  </div>
                  <div style={{display:"flex",gap:9,flexWrap:"wrap",justifyContent:"center",marginBottom:28}}>
                    <button className="g-btn g-btn-primary g-btn-sm" onClick={()=>setModal({type:"create-level"})}>➕ Créer un niveau</button>
                    <button className="g-btn g-btn-ghost g-btn-sm" onClick={()=>window.parent.postMessage({type:"REQUEST_SUBJECTS"},"*")}>↻ Recharger</button>
                  </div>
                  <div className="g-tips">
                    {[
                      {icon:"1️⃣",t:"Connecte ton dossier",d:"Bannière en haut → «📂 Choisir le dossier». Sélectionne la racine du projet MathoDuo."},
                      {icon:"2️⃣",t:"Crée la structure",d:"Niveau → Matière → Chapitre → Notion. Les fichiers .js sont générés automatiquement."},
                      {icon:"3️⃣",t:"Édite les notions",d:"Clique sur une notion pour ouvrir l'éditeur. Ajoute des blocs (définition, formule, graphe…)."},
                      {icon:"4️⃣",t:"Graphiques SVG",d:"Dans un bloc Graphe SVG, utilise le «📈 Constructeur visuel» pour créer des courbes et schémas."},
                    ].map((t,i)=>(
                      <div key={i} className="g-tip">
                        <span className="g-tip__icon">{t.icon}</span>
                        <div><div className="g-tip__title">{t.t}</div><div className="g-tip__desc">{t.d}</div></div>
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                <WelcomePanel stats={stats}/>
              )}
            </div>
          </div>

          {/* Modals */}
          {modal?.type==="create-level"   && <ModalCreateLevel onConfirm={createLevel} onClose={()=>setModal(null)}/>}
          {modal?.type==="create-subject" && <ModalCreateSubject levelId={modal.levelId} levelLabel={modal.levelLabel} onConfirm={d=>createSubject(modal.levelId,d)} onClose={()=>setModal(null)}/>}
          {modal?.type==="create-chapter" && <ModalCreateChapter onConfirm={d=>{
            const id=slugify(d.label)||("ch_"+genId());
            setNewChapters(p=>{const n={...p};const k=modal.levelId+"|"+modal.subjectId;if(!n[k])n[k]={};n[k][id]={id,label:d.label,icon:d.icon||"📚",description:"",xpMax:200,notions:[],l1Notions:[]};return n;});
            showToast("Chapitre «"+d.label+"» créé"); setModal(null);
          }} onClose={()=>setModal(null)}/>}
          {modal?.type==="create-notion"  && <ModalCreateNotion chapterLabel={modal.chapterLabel||""} onConfirm={label=>createNotion(modal.levelId,modal.subjectId,modal.chapterId,label)} onClose={()=>setModal(null)}/>}
          {modal?.type==="rename-chapter" && <ModalRename title="✏️ Renommer le chapitre" current={modal.current} onConfirm={v=>renameChapter(modal.levelId,modal.subjectId,modal.chapterId,v)} onClose={()=>setModal(null)}/>}
          {modal?.type==="rename-notion"  && <ModalRename title="✏️ Renommer la notion"   current={modal.current} onConfirm={v=>renameNotion(modal.levelId,modal.subjectId,modal.chapterId,modal.notionId,v)} onClose={()=>setModal(null)}/>}
          {modal?.type==="delete-chapter" && <ModalConfirm title="Supprimer le chapitre" msg={`Supprimer «${modal.label}» et ses notions ? Irréversible.`} onConfirm={()=>deleteChapter(modal.levelId,modal.subjectId,modal.chapterId)} onClose={()=>setModal(null)}/>}
          {modal?.type==="delete-notion"  && <ModalConfirm title="Supprimer la notion"   msg={`Supprimer «${modal.label}» ? Irréversible.`} onConfirm={()=>deleteNotion(modal.levelId,modal.subjectId,modal.chapterId,modal.notionId)} onClose={()=>setModal(null)}/>}

          <CtxMenu menu={ctxMenu.menu} close={ctxMenu.close}/>
          {toast && <div className="g-toast">✓ {toast}</div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
